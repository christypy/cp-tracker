<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CP值紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EF;
    --paper-2:#F1ECDE;
    --line:#DCD3B8;
    --ink:#2B2820;
    --ink-soft:#7A7263;
    --red:#B7472A;
    --green:#3F6B4F;
    --amber:#B6862C;
    --gold:#C9A227;
    --white:#FFFDF8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(var(--line) 0.6px, transparent 0.6px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:'Space Mono', monospace;}

  /* ---------- header ---------- */
  header{
    max-width:880px;
    margin:0 auto;
    padding:36px 20px 18px;
    text-align:center;
  }
  header .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  header h1{
    font-size:clamp(28px, 6vw, 40px);
    margin:6px 0 4px;
    font-weight:900;
    letter-spacing:-.01em;
  }
  header p{
    color:var(--ink-soft);
    font-size:14px;
    margin:0;
  }

  main{
    max-width:880px;
    margin:0 auto;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* ---------- card base: price-tag paper ---------- */
  .tag-card{
    background:var(--white);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line), 0 8px 24px -18px rgba(43,40,32,.4);
    padding:22px 20px 24px;
    position:relative;
  }
  .tag-card::before{
    /* punch hole */
    content:"";
    position:absolute;
    top:-9px;
    left:50%;
    transform:translateX(-50%);
    width:18px;
    height:18px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:50%;
    box-shadow:0 0 0 4px var(--white);
  }
  .card-title{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-family:'Space Mono', monospace;
    margin:0 0 14px;
    text-align:center;
  }

  /* ---------- quick calculator ---------- */
  .calc-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
    align-items:end;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .field input, .field select{
    font-family:'Space Mono', monospace;
    font-size:17px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
    width:100%;
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  .calc-result{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:6px;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .stamp{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:24px;
    padding:10px 18px;
    border:3px solid var(--ink-soft);
    border-radius:10px;
    color:var(--ink-soft);
    transform:rotate(-3deg);
    transition:transform .15s ease, color .15s ease, border-color .15s ease;
    white-space:nowrap;
    text-align:center;
  }
  .stamp.show{transform:rotate(-3deg) scale(1);}
  .stamp small{
    display:block;
    font-size:10px;
    letter-spacing:.1em;
    font-weight:400;
    text-align:center;
    margin-top:2px;
  }
  .stamp .unit-p{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
    margin-top:4px;
  }

  /* ---------- add item form ---------- */
  form#addForm{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
  }
  form#addForm .field.full{grid-column:1/-1;}
  #addBtn{
    grid-column:1/-1;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:.04em;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:opacity .15s ease;
  }
  #addBtn:active{opacity:.7;}
  #addBtn:disabled{opacity:.5;cursor:not-allowed;}
  #cancelEditBtn{
    grid-column:1/-1;
    font-family:'Space Mono', monospace;
    font-size:13px;
    padding:9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    margin-top:-4px;
  }
  #formMsg{
    grid-column:1/-1;
    font-size:13px;
    text-align:center;
    min-height:16px;
    color:var(--ink-soft);
  }

  /* ---------- controls row ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  #searchInput{
    font-family:'Noto Sans TC', sans-serif;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--white);
    min-width:150px;
    flex:1;
    max-width:220px;
  }
  #syncStatus{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  #refreshBtn{
    background:none;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 10px;
    cursor:pointer;
    font-size:14px;
    color:var(--ink-soft);
  }

  /* ---------- receipt table ---------- */
  .receipt{
    background:var(--white);
    border-radius:var(--radius);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .receipt-row{
    display:grid;
    grid-template-columns:1.8fr .8fr .8fr .6fr .8fr .9fr .8fr;
    gap:6px;
    align-items:center;
    padding:12px 14px;
    border-bottom:1px dashed var(--line);
  }
  .receipt-row:last-child{border-bottom:none;}
  .receipt-row.head{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
  }
  .receipt-row .name{
    font-weight:500;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .receipt-row .name-clickable{
    cursor:pointer;
    padding:4px;
    margin:-4px;
    border-radius:6px;
    transition:background-color .15s ease;
  }
  .receipt-row .name-clickable:hover{
    background-color:var(--paper-2);
  }
  .receipt-row .name-clickable::after{
    content:" 🔍 比價";
    font-size:10px;
    color:var(--gold);
    opacity:0;
    transition:opacity .15s ease;
  }
  .receipt-row .name-clickable:hover::after{
    opacity:1;
  }
  .receipt-row .name .cat-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    width:fit-content;
  }
  .receipt-row .name .date-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    width:fit-content;
  }
  .receipt-row.pending{
    opacity:.55;
  }
  .receipt-row .pending-label{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--gold);
  }
  .receipt-row .num{
    font-family:'Space Mono', monospace;
    text-align:right;
    font-size:13px;
  }
  /* stats group: on desktop its children become normal grid cells (display:contents),
     on mobile it becomes a wrapping row of labeled chips */
  .receipt-row .stats{
    display:contents;
  }
  .receipt-row .stat{
    font-family:'Space Mono', monospace;
    text-align:right;
    font-size:13px;
  }
  .receipt-row .stat-label{
    display:none;
  }
  .receipt-row .stat-val{
    font-weight:400;
  }
  .receipt-row .cp-cell{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
  }
  .receipt-row .cp-cell .stat-label{
    margin-right:auto;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    flex-shrink:0;
  }
  .dot.green{background:var(--green);}
  .dot.amber{background:var(--amber);}
  .dot.red{background:var(--red);}
  .dot.gray{background:var(--ink-soft);}
  .receipt-row .cp-val{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:14px;
  }
  .receipt-row .del{
    background:none;
    border:none;
    color:var(--line);
    cursor:pointer;
    font-size:14px;
    padding:2px 4px;
  }
  .receipt-row .del:hover{color:var(--red);}
  .receipt-row .row-actions{
    display:flex;
    gap:2px;
    justify-content:flex-end;
  }
  .receipt-row .edit{
    background:none;
    border:none;
    color:var(--line);
    cursor:pointer;
    font-size:14px;
    padding:2px 4px;
  }
  .receipt-row .edit:hover{color:var(--ink);}
  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* ---------- grouped by product name (different sizes together) ---------- */
  .group-block + .group-block{
    border-top:6px solid var(--paper-2);
  }
  .group-header{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    background:var(--paper-2);
    padding:8px 14px;
    border-bottom:1px dashed var(--line);
  }
  .receipt-row.grouped{
    border-left:3px solid var(--line);
  }
  .best-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--green);
    margin-left:2px;
    white-space:nowrap;
  }
  .rank-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--white);
    background:var(--gold);
    padding:1px 7px;
    border-radius:999px;
    margin-left:2px;
    white-space:nowrap;
    display:inline-block;
  }
  .sub-toggle{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.03em;
    color:var(--ink-soft);
    background:var(--paper-2);
    border:none;
    border-top:1px dashed var(--line);
    width:100%;
    text-align:left;
    padding:8px 14px;
    cursor:pointer;
  }
  .sub-toggle:hover{color:var(--ink);}
  .sub-items{
    background:var(--paper);
  }
  .receipt-row.sub-row{
    padding-left:26px;
    background:var(--paper);
  }
  .receipt-row.sub-row .name{
    font-weight:400;
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ---------- category multi-select input ---------- */
  .cat-input-row{
    display:flex;
    gap:8px;
  }
  .cat-input-row select{flex:1;}
  .cat-manual-btn{
    font-family:'Space Mono', monospace;
    font-size:12px;
    white-space:nowrap;
    padding:0 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .cat-manual-btn:hover{color:var(--ink); border-color:var(--ink);}
  .cat-manual-row{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .cat-manual-row input{
    flex:1;
    font-family:'Noto Sans TC', sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
  }
  .cat-manual-row button{
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:0 14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    cursor:pointer;
  }
  .cat-chips-selected{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .cat-chips-selected:empty{margin-top:0;}
  .cat-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:5px 6px 5px 12px;
    border-radius:999px;
    background:var(--ink);
    color:var(--paper);
  }
  .cat-chip-x{
    background:none;
    border:none;
    color:var(--paper);
    opacity:.7;
    cursor:pointer;
    font-size:11px;
    padding:2px 6px;
  }
  .cat-chip-x:hover{opacity:1;}
  .receipt-row .name .cat-badge-group{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }

  /* ---------- category average stats bar ---------- */
  #categoryStatsBar{
    display:none;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 16px;
    text-align:center;
  }
  #categoryStatsBar.show{display:block;}
  #categoryStatsBar strong{color:var(--ink);}

  /* ---------- settings ---------- */
  details#settings{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 18px;
  }
  details#settings summary{
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.06em;
  }
  .settings-body{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .settings-body input{
    font-family:'Space Mono', monospace;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    width:100%;
  }
  .settings-body button{
    align-self:flex-start;
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:8px 14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    cursor:pointer;
  }
  .settings-body p{
    font-size:12px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.6;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Space Mono', monospace;
    margin-top:30px;
  }

  /* ---------- mobile ---------- */
  @media (max-width:560px){
    .receipt-row.head{display:none;} /* labels now shown inline per row instead */

    .receipt-row{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px 10px;
      font-size:12px;
      padding:14px;
    }
    .receipt-row .name{
      flex:0 0 100%;
    }
    .receipt-row .stats{
      display:flex;
      flex-wrap:wrap;
      flex:0 0 100%;
      gap:6px 16px;
    }
    .receipt-row .stat{
      display:flex;
      align-items:baseline;
      gap:4px;
      text-align:left;
    }
    .receipt-row .stat-label{
      display:inline;
      font-size:10px;
      letter-spacing:.04em;
      color:var(--ink-soft);
    }
    .receipt-row .stat-val{
      font-weight:700;
      font-size:13px;
    }
    .receipt-row .cp-cell{
      flex:1 1 auto;
      justify-content:flex-start;
      gap:8px;
      padding-top:8px;
      border-top:1px dashed var(--line);
    }
    .receipt-row .cp-cell .stat-label{
      display:inline;
      margin-right:0;
    }
    .receipt-row .cp-val{
      font-size:15px;
    }
    .receipt-row .row-actions,
    .receipt-row .pending-label,
    .receipt-row > .del{
      flex:0 0 auto;
      margin-left:auto;
      padding-top:8px;
      border-top:1px dashed var(--line);
    }

    form#addForm{grid-template-columns:1fr 1fr 1fr;}
    .calc-grid{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">$ / g Ledger</div>
  <h1>CP值帳本</h1>
  <p>輸入克數跟價格，馬上算出 CP 值與單罐價格 · 資料同步 Google 試算表</p>
</header>

<main>

  <!-- 新增品項（先算再填資料） -->
  <section class="tag-card">
    <p class="card-title" id="formTitle">新增品項</p>
    <form id="addForm">
      <div class="field">
        <label for="itemGrams">單罐克數 (g)</label>
        <input type="number" id="itemGrams" inputmode="decimal" step="any" placeholder="例如 50" required>
      </div>
      <div class="field">
        <label for="itemPrice">總價格 ($)</label>
        <input type="number" id="itemPrice" inputmode="decimal" placeholder="例如 380" required>
      </div>
      <div class="field">
        <label for="itemCount">數量 (入/罐)</label>
        <input type="number" id="itemCount" inputmode="numeric" value="1" min="1" placeholder="例如 1" required>
      </div>

      <div class="calc-result">
        <div class="stamp mono" id="calcStamp">
          --<small>$ / g</small>
          <div class="unit-p" id="unitPricePreview">單罐 --</div>
        </div>
      </div>

      <div class="field full">
        <label for="itemName">品項名稱</label>
        <input type="text" id="itemName" placeholder="例如 DHC 金靚白水亮防曬乳" required>
      </div>
      <div class="field full">
        <label>類別（可複選）</label>
        <div class="cat-input-row">
          <select id="categoryDropdown">
            <option value="">-- 選擇既有類別 --</option>
          </select>
          <button type="button" id="categoryManualBtn" class="cat-manual-btn">✎ 手動輸入</button>
        </div>
        <div class="cat-manual-row" id="categoryManualRow" style="display:none;">
          <input type="text" id="categoryManualInput" placeholder="輸入新類別，Enter 或點新增">
          <button type="button" id="categoryManualAddBtn">新增</button>
        </div>
        <div class="cat-chips-selected" id="categoryChipsSelected"></div>
      </div>
      <div class="field full">
        <label for="itemDate">日期</label>
        <input type="date" id="itemDate">
      </div>
      <div class="field full">
        <label for="itemLocation">購買地點</label>
        <select id="itemLocation">
          <option value="">-- 選擇購買地點 --</option>
          <option value="全聯線上">全聯線上</option>
          <option value="全聯">全聯</option>
          <option value="家樂福線上">家樂福線上</option>
          <option value="PChome">PChome</option>
          <option value="MoMo">MoMo</option>
          <option value="蝦皮">蝦皮</option>
          <option value="LG生活">LG生活</option>
          <option value="花王特賣">花王特賣</option>
          <option value="康是美">康是美</option>
          <option value="寶雅">寶雅</option>
          <option value="寶雅線上">寶雅線上</option>
          <option value="屈臣氏">屈臣氏</option>
          <option value="自行輸入">自行輸入…</option>
        </select>
        <input type="text" id="itemLocationCustom" placeholder="輸入購買地點" style="display:none; margin-top:6px;">
      </div>

      <button type="submit" id="addBtn">加入紀錄</button>
      <button type="button" id="cancelEditBtn" style="display:none;">取消編輯</button>
      <div id="formMsg"></div>
    </form>
  </section>

  <!-- 篩選 / 搜尋 -->
  <section class="controls">
    <div class="chips" id="categoryChips">
      <button class="chip active" data-cat="__all__">全部</button>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="sortToggleBtn" class="chip" title="切換排序方向">CP值 低→高 ↑</button>
      <input type="text" id="searchInput" placeholder="搜尋品項…">
    </div>
  </section>

  <div id="categoryStatsBar"></div>

  <div id="syncStatus">
    <span id="syncText">尚未同步</span>
    <button id="refreshBtn" title="重新整理">↻</button>
  </div>

  <!-- 表格 -->
  <section class="receipt">
    <div class="receipt-row head">
      <div>品項 / 類別 (點擊名稱可比價)</div>
      <div class="stats">
        <div class="stat grams-col">克數</div>

    <div id="tableBody">
      <div class="empty-state">載入中…</div>
    </div>
  </section>

  <!-- 設定 -->
  <details id="settings">

    <div class="settings-body">
      <p>把你部署好的 Google Apps Script 網頁應用程式網址貼在這裡。網址會存在這台裝置的瀏覽器裡，不會上傳到任何地方。</p>

</main>

<!-- 比價彈窗 Modal -->
<div id="compareModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">

        換算後 CP 值：<span class="mono" style="font-weight:700; color:var(--ink);"></span> $ / g(ml)
      </div>
      <div id="modalVerdict" class="stamp mono" style="font-size:15px; padding:6px 12px; transform:none; display:none; margin-top:4px;">--</div>

      <div class="field" style="margin-bottom:10px;">
        <label for="modalLocation">🎉 更划算！在哪裡找到這個價格？</label>
        <select id="modalLocation">
          <option value="">-- 選擇購買地點 --</option>

      <button type="button" id="modalSaveBtn" style="width:100%; padding:10px; border:none; border-radius:8px; background:var(--green); color:var(--white); cursor:pointer; font-family:'Space Mono', monospace; font-size:13px; font-weight:700;">💾 儲存這筆更划算的紀錄</button>
      <div id="modalSaveMsg" style="font-size:12px; text-align:center; margin-top:8px; color:var(--ink-soft);"></div>
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button type="button" id="closeModalBtn" style="flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); cursor:pointer; font-family:'Space Mono', monospace; font-size:13px;">關閉</button>
    </div>
  </div>
</div>

<footer>手動記帳，理性剁手 · made for 劃算度控</footer>

<script>
(function(){
  "use strict";

  const LS_URL_KEY = "cp_tracker_script_url";
  const LS_CACHE_KEY = "cp_tracker_cache";
  const LS_LOCATIONS_KEY = "cp_tracker_custom_locations";

  // 預設同步網址
  const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4SLRn8eRvg9pP4rrptYfbgIt3W5en2vrrfyUJG2SxpenrZp4D07wuRKiZDbIoMDq7/exec";

  // 預設預設選單地點
  const DEFAULT_LOCATIONS = [
    "全聯線上", "全聯", "家樂福線上", "PChome", "MoMo", "蝦皮", 
    "LG生活", "花王特賣", "康是美", "寶雅", "寶雅線上", "屈臣氏"
  ];

  let scriptUrl = localStorage.getItem(LS_URL_KEY) || DEFAULT_SCRIPT_URL;
  let customLocations = JSON.parse(localStorage.getItem(LS_LOCATIONS_KEY) || "[]");
  let items = [];
  let activeCategory = "__all__";
  let searchTerm = "";
  let sortAsc = true;
  let expandedGroups = new Set();

  const $ = (id) => document.getElementById(id);
  const scriptUrlInput = $("scriptUrl");
  const tableBody = $("tableBody");
  const syncText = $("syncText");
  const categoryChips = $("categoryChips");
  const formMsg = $("formMsg");
  const addBtn = $("addBtn");
  const categoryStatsBar = $("categoryStatsBar");

  scriptUrlInput.value = scriptUrl;

  // ---------- 類別（可複選）管理 ----------
  const categoryDropdown = $("categoryDropdown");
  const categoryManualBtn = $("categoryManualBtn");
  const categoryManualRow = $("categoryManualRow");
  const categoryManualInput = $("categoryManualInput");
  const categoryManualAddBtn = $("categoryManualAddBtn");
  const categoryChipsSelectedEl = $("categoryChipsSelected");
  let selectedCategories = [];

  function getAllKnownCategories(){
    const set = new Set();
    items.forEach(i => (i.categories || []).forEach(c => { if(c) set.add(c); }));
    return Array.from(set).sort();
  }

  function renderCategoryDropdownOptions(){
    const known = getAllKnownCategories();
    categoryDropdown.innerHTML = '<option value="">-- 選擇既有類別 --</option>' +
      known.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  }

  function renderSelectedCategoryChips(){
    categoryChipsSelectedEl.innerHTML = selectedCategories.map(c => `
      <span class="cat-chip">${escapeHtml(c)}<button type="button" class="cat-chip-x" data-cat="${escapeHtml(c)}">✕</button></span>
    `).join("");
    categoryChipsSelectedEl.querySelectorAll(".cat-chip-x").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedCategories = selectedCategories.filter(c => c !== btn.dataset.cat);
        renderSelectedCategoryChips();
      });
    });
  }

  function addSelectedCategory(cat){
    cat = String(cat || "").trim();
    if(!cat) return;
    if(!selectedCategories.includes(cat)) selectedCategories.push(cat);
    renderSelectedCategoryChips();
  }

  function resetCategorySelection(){
    selectedCategories = [];
    renderSelectedCategoryChips();
    categoryDropdown.value = "";
    categoryManualInput.value = "";
    categoryManualRow.style.display = "none";
  }

  categoryDropdown.addEventListener("change", () => {
    if(categoryDropdown.value){
      addSelectedCategory(categoryDropdown.value);
      categoryDropdown.value = "";
    }
  });

  categoryManualBtn.addEventListener("click", () => {
    const showing = categoryManualRow.style.display !== "none";
    categoryManualRow.style.display = showing ? "none" : "flex";
    if(!showing) categoryManualInput.focus();
  });

  function commitManualCategory(){
    addSelectedCategory(categoryManualInput.value);
    categoryManualInput.value = "";
    categoryManualInput.focus();
  }
  categoryManualAddBtn.addEventListener("click", commitManualCategory);
  categoryManualInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); commitManualCategory(); }
  });

  // ---------- 新增表單內的即時試算 ----------
  const itemGramsInput = $("itemGrams");
  const itemPriceInput = $("itemPrice");
  const itemCountInput = $("itemCount");
  const calcStamp = $("calcStamp");

  function updateCalc(){
    const g = parseFloat(itemGramsInput.value);
    const p = parseFloat(itemPriceInput.value);
    const count = parseInt(itemCountInput.value, 10) || 1;

    if(g > 0 && p >= 0 && count > 0 && !isNaN(g) && !isNaN(p)){
      const unitPrice = p / count;
      const cp = p / (g * count);
      calcStamp.innerHTML = cp.toFixed(3) + "<small>$ / g</small>" +
                            "<div class='unit-p'>單罐 $" + formatNum(unitPrice) + "</div>";
      calcStamp.style.color = "var(--ink)";
      calcStamp.style.borderColor = "var(--ink)";
    } else {
      calcStamp.innerHTML = "--<small>$ / g</small><div class='unit-p'>單罐 --</div>";
      calcStamp.style.color = "var(--ink-soft)";
      calcStamp.style.borderColor = "var(--ink-soft)";
    }
  }
  itemGramsInput.addEventListener("input", updateCalc);
  itemPriceInput.addEventListener("input", updateCalc);
  itemCountInput.addEventListener("input", updateCalc);

  // ---------- 購買地點（記憶與動態渲染） ----------
  const itemLocationSelect = $("itemLocation");
  const itemLocationCustom = $("itemLocationCustom");
  const modalLocationSelect = $("modalLocation");
  const modalLocationCustom = $("modalLocationCustom");

  function getLocationValue(selectEl, customEl){
    if(selectEl.value === "自行輸入"){
      return customEl.value.trim();
    }
    return selectEl.value;
  }

  function setLocationValue(selectEl, customEl, loc){
    if(!loc){
      selectEl.value = "";
      customEl.value = "";
      customEl.style.display = "none";
      return;
    }
    const preset = Array.from(selectEl.options).some(o => o.value === loc && o.value !== "自行輸入");
    if(preset){
      selectEl.value = loc;
      customEl.value = "";
      customEl.style.display = "none";
    } else {
      selectEl.value = "自行輸入";
      customEl.value = loc;
      customEl.style.display = "block";
    }
  }

  function buildLocationOptions(selectEl, customEl){
    // 收集所有出現過的地點（包含預設、使用者新增、歷史紀錄）
    const historyLocations = items.map(i => i.location).filter(Boolean);
    const allLocations = Array.from(new Set([...DEFAULT_LOCATIONS, ...customLocations, ...historyLocations]));

    const currentVal = getLocationValue(selectEl, customEl);

    // 清空並重新建立選單
    selectEl.innerHTML = '<option value="">-- 選擇購買地點 --</option>';
    allLocations.forEach(loc => {
      const opt = document.createElement("option");
      opt.value = loc;
      opt.textContent = loc;
      selectEl.appendChild(opt);
    });

    const customOpt = document.createElement("option");
    customOpt.value = "自行輸入";
    customOpt.textContent = "自行輸入…";
    selectEl.appendChild(customOpt);

    setLocationValue(selectEl, customEl, currentVal);
  }

  function renderLocationOptions(){
    buildLocationOptions(itemLocationSelect, itemLocationCustom);
    buildLocationOptions(modalLocationSelect, modalLocationCustom);
  }

  function saveCustomLocation(loc){
    if(!loc) return;
    if(!DEFAULT_LOCATIONS.includes(loc) && !customLocations.includes(loc)){
      customLocations.push(loc);
      localStorage.setItem(LS_LOCATIONS_KEY, JSON.stringify(customLocations));
    }
  }

  function bindLocationToggle(selectEl, customEl){
    selectEl.addEventListener("change", () => {
      if(selectEl.value === "自行輸入"){
        customEl.style.display = "block";
        customEl.focus();
      } else {
        customEl.style.display = "none";
        customEl.value = "";
      }
    });
  }
  bindLocationToggle(itemLocationSelect, itemLocationCustom);
  bindLocationToggle(modalLocationSelect, modalLocationCustom);

  // ---------- 快速比價 Modal 邏輯 ----------
  const compareModal = $("compareModal");
  const modalItemName = $("modalItemName");
  const modalBaseCp = $("modalBaseCp");
  const modalGrams = $("modalGrams");
  const modalCount = $("modalCount");
  const modalPrice = $("modalPrice");
  const modalTargetLabel = $("modalTargetLabel");
  const modalTargetValue = $("modalTargetValue");
  const modalTargetHint = $("modalTargetHint");
  const modalUnitCp = $("modalUnitCp");
  const modalUnitCpVal = modalUnitCp.querySelector("span");
  const modalVerdict = $("modalVerdict");
  const closeModalBtn = $("closeModalBtn");
  const modalSaveSection = $("modalSaveSection");
  const modalSaveBtn = $("modalSaveBtn");
  const modalSaveMsg = $("modalSaveMsg");

  let activeCompareCp = 0;
  let activeCompareItem = null;
  const EPSILON = 0.05; // 價格容許誤差（四捨五入/浮點數用），在此範圍內視為「一樣划算」

  function openCompareModal(item){
    activeCompareCp = item.cp;
    activeCompareItem = item;
    modalItemName.textContent = item.name;
    modalBaseCp.textContent = item.cp.toFixed(3);
    // 先帶入原始紀錄的數值，使用者只需要改動有變化的欄位即可即時比較
    modalGrams.value = item.grams;
    modalCount.value = item.count || 1;
    modalPrice.value = item.price;
    setLocationValue(modalLocationSelect, modalLocationCustom, "");
    modalSaveSection.style.display = "none";
    modalSaveMsg.textContent = "";
    compareModal.style.display = "flex";
    calcComparison();
    modalGrams.focus();
    modalGrams.select();
  }

  function resetResult(){
    modalTargetLabel.textContent = "等比例目標";
    modalTargetValue.textContent = "--";
    modalTargetHint.style.display = "none";
    modalUnitCp.style.display = "none";
    modalVerdict.style.display = "none";
    modalSaveSection.style.display = "none";
  }

  function calcComparison(){
    const gramsRaw = modalGrams.value.trim();
    const priceRaw = modalPrice.value.trim();
    const countRaw = modalCount.value.trim();

    const newGrams = parseFloat(gramsRaw);
    const newPrice = parseFloat(priceRaw);
    // 數量至少為 1，避免使用者清空或輸入 0 / 負數時算式壞掉
    let newCount = parseInt(countRaw, 10);
    if(!(newCount > 0)) newCount = 1;

    const hasGrams = gramsRaw !== "" && newGrams > 0 && !isNaN(newGrams);
    const hasPrice = priceRaw !== "" && !isNaN(newPrice) && newPrice >= 0;
    const hasBaseCp = activeCompareCp > 0;

    resetResult();

    if(!hasBaseCp || (!hasGrams && !hasPrice)){
      return;
    }

    if(hasGrams){
      // 已知「單件容量 × 數量」→ 反推打平所需的售價（目標售價）
      const targetPrice = activeCompareCp * newGrams * newCount;
      modalTargetLabel.textContent = "等比例目標價";
      modalTargetValue.textContent = "$" + targetPrice.toFixed(1);

      if(hasPrice){
        // 兩邊都填了，直接算出這次交易實際的 CP 值，並跟基準比較
        const newCp = newPrice / (newGrams * newCount);
        modalUnitCp.style.display = "block";
        modalUnitCpVal.textContent = newCp.toFixed(3);

        modalVerdict.style.display = "block";
        const diff = newPrice - targetPrice;
        if(diff < -EPSILON){
          modalVerdict.textContent = "🎉 更划算！(省 $" + Math.abs(diff).toFixed(1) + ")";
          modalVerdict.style.color = "var(--green)";
          modalVerdict.style.borderColor = "var(--green)";
          modalSaveSection.style.display = "block";
        } else if(diff > EPSILON){
          modalVerdict.textContent = "❌ 買貴了！(貴 $" + diff.toFixed(1) + ")";
          modalVerdict.style.color = "var(--red)";
          modalVerdict.style.borderColor = "var(--red)";
        } else {
          modalVerdict.textContent = "⚖ 劃算度相同";
          modalVerdict.style.color = "var(--ink-soft)";
          modalVerdict.style.borderColor = "var(--ink-soft)";
        }
      } else {
        modalTargetHint.style.display = "block";
        modalTargetHint.textContent = "填入現場售價即可看到判斷結果";
      }
    } else {
      // 沒有（或還不知道）容量，但已知數量與售價 → 反推打平所需的容量（目標容量）
      const targetGrams = newPrice / (activeCompareCp * newCount);
      modalTargetLabel.textContent = "目標容量";
      modalTargetValue.textContent = (targetGrams > 0 ? targetGrams.toFixed(1) : "0") + " g(ml)";
      modalTargetHint.style.display = "block";
      modalTargetHint.textContent = "容量 ≥ 這個數字才划算，找到包裝標示的容量後可填入比對";
    }
  }

  modalGrams.addEventListener("input", calcComparison);
  modalCount.addEventListener("input", calcComparison);
  modalPrice.addEventListener("input", calcComparison);

  // 比價後如果比原本更划算，要求輸入地點並存成新的一筆紀錄
  function saveCompareAsNewRecord(){
    if(!activeCompareItem){
      modalSaveMsg.textContent = "找不到比對的品項";
      modalSaveMsg.style.color = "var(--red)";
      return;
    }
    if(!scriptUrl){
      modalSaveMsg.textContent = "請先在下方「設定」貼上同步網址";
      modalSaveMsg.style.color = "var(--red)";
      return;
    }
    const newGrams = parseFloat(modalGrams.value);
    const newPrice = parseFloat(modalPrice.value);
    let newCount = parseInt(modalCount.value, 10);
    if(!(newCount > 0)) newCount = 1;

    if(!(newGrams > 0) || isNaN(newPrice) || newPrice < 0){
      modalSaveMsg.textContent = "請確認容量與售價已正確填寫";
      modalSaveMsg.style.color = "var(--red)";
      return;
    }

    const location = getLocationValue(modalLocationSelect, modalLocationCustom);
    if(!location){
      modalSaveMsg.textContent = "請輸入或選擇購買地點";
      modalSaveMsg.style.color = "var(--red)";
      modalLocationSelect.focus();
      return;
    }

    saveCustomLocation(location);

    const unitPrice = newPrice / newCount;
    const cp = newPrice / (newGrams * newCount);
    const date = new Date().toISOString().slice(0, 10);
    const name = activeCompareItem.name;
    const categories = (activeCompareItem.categories || []).slice();
    const category = categories.join(",");

    tempIdCounter += 1;
    const tempId = "pending-" + tempIdCounter;

    items.unshift({
      row: tempId,
      tempId: tempId,
      name, categories,
      grams: newGrams,
      price: newPrice,
      count: newCount,
      unitPrice, cp, date, location,
      pending: true,
      uploadError: false
    });

    renderLocationOptions();
    renderCategoryChips();
    renderTable();

    uploadQueue.push({ tempId, name, category, grams: newGrams, price: newPrice, count: newCount, unitPrice, date, location });
    processQueue();

    modalSaveMsg.textContent = "✓ 已加入紀錄，背景同步中…";
    modalSaveMsg.style.color = "var(--green)";
    setTimeout(() => {
      compareModal.style.display = "none";
    }, 900);
  }

  modalSaveBtn.addEventListener("click", saveCompareAsNewRecord);

  closeModalBtn.addEventListener("click", () => {
    compareModal.style.display = "none";
  });

  compareModal.addEventListener("click", (e) => {
    if(e.target === compareModal) compareModal.style.display = "none";
  });

  // ---------- 設定 ----------
  $("saveUrlBtn").addEventListener("click", () => {
    scriptUrl = scriptUrlInput.value.trim();
    localStorage.setItem(LS_URL_KEY, scriptUrl);
    formMsg.textContent = "";
    loadItems();
  });

  $("refreshBtn").addEventListener("click", loadItems);

  // ---------- 讀取資料 ----------
  async function loadItems(){
    if(!scriptUrl){
      tableBody.innerHTML = '<div class="empty-state">請先在下方「設定」貼上你的 Google Apps Script 網址</div>';
      syncText.textContent = "尚未設定同步網址";
      return;
    }
    syncText.textContent = "同步中…";
    try{
      const res = await fetch(scriptUrl + "?t=" + Date.now());
      const data = await res.json();
      if(data.status !== "ok") throw new Error(data.message || "讀取失敗");
      const serverItems = (data.items || []).map(normalizeItem);
      const stillPending = items.filter(i => i.pending && uploadQueue.some(j => j.tempId === i.tempId));
      items = [...stillPending, ...serverItems];
      localStorage.setItem(LS_CACHE_KEY, JSON.stringify(serverItems));
      syncText.textContent = "已同步 · " + new Date().toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"});
      renderLocationOptions();
      renderCategoryChips();
      renderTable();
    }catch(err){
      const cached = localStorage.getItem(LS_CACHE_KEY);
      if(cached){
        items = JSON.parse(cached).map(migrateItem);
        renderLocationOptions();
        renderCategoryChips();
        renderTable();
      }
      syncText.textContent = "同步失敗，顯示上次快取（" + err.message + "）";
    }
  }

  // 相容舊版快取資料（舊版只有單一 category 字串，沒有 categories 陣列）
  function migrateItem(item){
    if(!item.categories || !item.categories.length){
      item.categories = item.category ? parseCategories(item.category) : ["未分類"];
    }
    return item;
  }

  function parseCategories(str){
    return String(str || "")
      .split(/[,、;]+/)
      .map(s => s.trim())
      .filter(Boolean);
  }

  function normalizeItem(raw){
    const grams = Number(raw["克數"]);
    const price = Number(raw["價格"]);
    const count = Number(raw["數量"]) || 1;
    const unitPrice = raw["單罐價格"] !== undefined && raw["單罐價格"] !== "" ? Number(raw["單罐價格"]) : (count > 0 ? price / count : price);
    const cp = (grams * count) > 0 ? price / (grams * count) : 0;
    const categories = parseCategories(raw["類別"]);
    return {
      row: raw["_row"],
      name: raw["品項名稱"] || "",
      categories: categories.length ? categories : ["未分類"],
      grams: grams,
      price: price,
      count: count,
      unitPrice: unitPrice,
      cp: cp,
      date: raw["日期"] || "",
      location: raw["地點"] || "",
      pending: false
    };
  }

  // ---------- 新增品項（背景佇列上傳） ----------
  const itemDateInput = $("itemDate");
  itemDateInput.value = new Date().toISOString().slice(0, 10);

  const uploadQueue = [];
  let isProcessingQueue = false;
  let tempIdCounter = 0;

  function updateQueueStatus(){
    const n = uploadQueue.length + (isProcessingQueue ? 1 : 0);
    if(n > 0){
      syncText.textContent = "背景上傳中…（剩餘 " + n + " 筆）";
    }
  }

  async function processQueue(){
    if(isProcessingQueue) return;
    isProcessingQueue = true;
    while(uploadQueue.length > 0){
      const job = uploadQueue[0];
      updateQueueStatus();
      try{
        await fetch(scriptUrl, {
          method: "POST",
          headers: {"Content-Type": "text/plain;charset=utf-8"},
          body: JSON.stringify({
            action: "add",
            name: job.name,
            category: job.category,
            grams: job.grams,
            price: job.price,
            count: job.count,
            unitPrice: job.unitPrice,
            date: job.date,
            location: job.location
          })
        });
        job.failed = false;
      }catch(err){
        job.failed = true;
        const stillPending = items.find(i => i.tempId === job.tempId);
        if(stillPending){
          stillPending.uploadError = true;
        }
        renderTable();
      }
      uploadQueue.shift();
    }
    isProcessingQueue = false;
    await loadItems();
  }

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if(!scriptUrl){
      formMsg.textContent = "請先設定同步網址";
      return;
    }
    const name = $("itemName").value.trim();
    const categories = selectedCategories.slice();
    const category = categories.join(",");
    const grams = parseFloat($("itemGrams").value);
    const price = parseFloat($("itemPrice").value);
    const count = parseInt($("itemCount").value, 10) || 1;
    const date = itemDateInput.value || "";
    const location = getLocationValue(itemLocationSelect, itemLocationCustom);
    if(!name || categories.length === 0 || !(grams > 0) || isNaN(price) || price < 0 || count < 1){
      formMsg.textContent = "請確認欄位都已正確填寫（至少選擇一個類別）";
      return;
    }
    if(itemLocationSelect.value === "自行輸入" && !location){
      formMsg.textContent = "請輸入購買地點，或改選其他選項";
      return;
    }

    // 儲存新輸入的地點並刷新下拉選單
    saveCustomLocation(location);

    const unitPrice = price / count;
    const cp = price / (grams * count);

    if(editingRow !== null){
      submitUpdate(editingRow, { name, category, categories, grams, price, count, unitPrice, date, location });
      return;
    }

    tempIdCounter += 1;
    const tempId = "pending-" + tempIdCounter;

    items.unshift({
      row: tempId,
      tempId: tempId,
      name, categories, grams, price, count, unitPrice, cp, date, location,
      pending: true,
      uploadError: false
    });

    renderLocationOptions();
    renderCategoryChips();
    renderTable();

    $("addForm").reset();
    $("itemCount").value = "1";
    itemDateInput.value = date || new Date().toISOString().slice(0, 10);
    setLocationValue(itemLocationSelect, itemLocationCustom, "");
    resetCategorySelection();
    formMsg.textContent = "";
    $("itemGrams").focus();

    uploadQueue.push({ tempId, name, category, grams, price, count, unitPrice, date, location });
    processQueue();
  });

  // ---------- 編輯品項 ----------
  const formTitle = $("formTitle");
  const cancelEditBtn = $("cancelEditBtn");
  let editingRow = null;

  function startEdit(item){
    editingRow = item.row;
    $("itemGrams").value = item.grams;
    $("itemPrice").value = item.price;
    $("itemCount").value = item.count || 1;
    $("itemName").value = item.name;
    selectedCategories = (item.categories || []).slice();
    renderSelectedCategoryChips();
    categoryManualRow.style.display = "none";
    itemDateInput.value = item.date || new Date().toISOString().slice(0, 10);
    setLocationValue(itemLocationSelect, itemLocationCustom, item.location || "");
    updateCalc();
    formTitle.textContent = "編輯品項";
    addBtn.textContent = "更新紀錄";
    cancelEditBtn.style.display = "block";
    formMsg.textContent = "";
    $("itemGrams").scrollIntoView({ behavior: "smooth", block: "center" });
    $("itemGrams").focus();
  }

  function endEdit(){
    editingRow = null;
    $("addForm").reset();
    $("itemCount").value = "1";
    itemDateInput.value = new Date().toISOString().slice(0, 10);
    setLocationValue(itemLocationSelect, itemLocationCustom, "");
    resetCategorySelection();
    updateCalc();
    formTitle.textContent = "新增品項";
    addBtn.textContent = "加入紀錄";
    cancelEditBtn.style.display = "none";
  }

  cancelEditBtn.addEventListener("click", endEdit);

  function submitUpdate(row, fields){
    const target = items.find(i => i.row === row);
    if(target){
      target.name = fields.name;
      target.categories = fields.categories;
      target.grams = fields.grams;
      target.price = fields.price;
      target.count = fields.count;
      target.unitPrice = fields.unitPrice;
      target.cp = fields.price / (fields.grams * fields.count);
      target.date = fields.date;
      target.location = fields.location;
      target.updating = true;
    }
    renderLocationOptions();
    renderCategoryChips();
    renderTable();
    endEdit();
    formMsg.textContent = "";
    syncText.textContent = "背景更新中…";

    fetch(scriptUrl, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({ action: "update", row, ...fields })
    }).then(() => {
      loadItems();
    }).catch((err) => {
      syncText.textContent = "更新失敗：" + err.message;
    });
  }

  // ---------- 刪除品項 ----------
  async function deleteItem(row){
    if(String(row).startsWith("pending-")){
      items = items.filter(i => i.row !== row);
      renderTable();
      return;
    }
    if(!scriptUrl) return;
    if(!confirm("確定要刪除這筆紀錄嗎？")) return;
    try{
      await fetch(scriptUrl, {
        method: "POST",
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({ action: "delete", row })
      });
      await loadItems();
    }catch(err){
      alert("刪除失敗：" + err.message);
    }
  }

  // ---------- 類別篩選 ----------
  function renderCategoryChips(){
    const cats = getAllKnownCategories();
    renderCategoryDropdownOptions();
    categoryChips.innerHTML = "";
    const allChip = document.createElement("button");
    allChip.className = "chip" + (activeCategory === "__all__" ? " active" : "");
    allChip.textContent = "全部";
    allChip.dataset.cat = "__all__";
    allChip.addEventListener("click", () => { activeCategory = "__all__"; renderCategoryChips(); renderTable(); });
    categoryChips.appendChild(allChip);
    cats.forEach(c => {
      const chip = document.createElement("button");
      chip.className = "chip" + (activeCategory === c ? " active" : "");
      chip.textContent = c;
      chip.dataset.cat = c;
      chip.addEventListener("click", () => { activeCategory = c; renderCategoryChips(); renderTable(); });
      categoryChips.appendChild(chip);
    });
  }

  $("searchInput").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderTable();
  });

  const sortToggleBtn = $("sortToggleBtn");
  sortToggleBtn.addEventListener("click", () => {
    sortAsc = !sortAsc;
    sortToggleBtn.textContent = sortAsc ? "CP值 低→高 ↑" : "CP值 高→低 ↓";
    renderTable();
  });

  // ---------- 表格渲染 ----------

  // 依「類別」建立分組：同一品項若有多個類別，會同時計入每個類別的排名
  function buildCategoryMap(){
    const map = new Map();
    items.forEach(i => {
      if(i.pending) return;
      (i.categories || []).forEach(c => {
        if(!map.has(c)) map.set(c, []);
        map.get(c).push(i);
      });
    });
    return map;
  }

  function tierFor(item, sameCategory){
    if(sameCategory.length < 2) return "gray";
    const sorted = sameCategory.slice().sort((a,b) => a.cp - b.cp);
    const idx = sorted.indexOf(item);
    const third = Math.ceil(sorted.length / 3);
    if(idx < third) return "green";
    if(idx < third * 2) return "amber";
    return "red";
  }

  // 該品項在其主要類別中的 CP 值排名百分比（數字越小代表越划算，"前 X%"）
  function percentileFor(item, categoryMap){
    const cat = (item.categories || [])[0];
    if(!cat) return null;
    const group = categoryMap.get(cat);
    if(!group || group.length < 2) return null;
    const sorted = group.slice().sort((a,b) => a.cp - b.cp);
    const idx = sorted.indexOf(item);
    if(idx === -1) return null;
    const pct = Math.max(1, Math.round(((idx + 1) / sorted.length) * 100));
    return { pct, cat };
  }

  function updateCategoryStatsBar(){
    if(activeCategory === "__all__"){
      categoryStatsBar.classList.remove("show");
      return;
    }
    const group = items.filter(i => !i.pending && (i.categories || []).includes(activeCategory));
    if(group.length === 0){
      categoryStatsBar.classList.remove("show");
      return;
    }
    const avg = group.reduce((sum, i) => sum + i.cp, 0) / group.length;
    const best = group.slice().sort((a,b) => a.cp - b.cp)[0];
    categoryStatsBar.innerHTML = `類別「<strong>${escapeHtml(activeCategory)}</strong>」平均 CP 值：<strong>${avg.toFixed(3)}</strong> $/g（共 ${group.length} 筆・最划算 ${best.cp.toFixed(3)}）`;
    categoryStatsBar.classList.add("show");
  }

  function renderTable(){
    updateCategoryStatsBar();

    let list = items.filter(i => {
      const matchCat = activeCategory === "__all__" || (i.categories || []).includes(activeCategory);
      const matchSearch = !searchTerm || i.name.toLowerCase().includes(searchTerm);
      return matchCat && matchSearch;
    });

    if(list.length === 0){
      tableBody.innerHTML = '<div class="empty-state">還沒有符合條件的紀錄</div>';
      return;
    }

    const categoryMap = buildCategoryMap();

    // ---- 依品項名稱分組：同個產品即使 ml/g 數或數量不同，也整合在一起方便比較 ----
    const groupOrder = [];
    const groupsMap = new Map();
    list.forEach(item => {
      const key = item.name.trim().toLowerCase();
      if(!groupsMap.has(key)){
        groupsMap.set(key, []);
        groupOrder.push(key);
      }
      groupsMap.get(key).push(item);
    });

    const groups = groupOrder.map(key => {
      const arr = groupsMap.get(key).slice().sort((a,b) => a.cp - b.cp); // 組內固定依 CP 值由低到高，方便比價

      // 代表項目：優先挑「1入」中最划算的；若組內沒有 1 入，則退回整體最划算的那個
      const singles = arr.filter(i => (i.count || 1) === 1);
      const rep = singles.length ? singles.slice().sort((a,b) => a.cp - b.cp)[0] : arr[0];
      const others = arr.filter(i => i !== rep);

      return { key, items: arr, rep, others, bestCp: arr[0].cp };
    });

    // 組與組之間依目前排序方向（依各組最划算的 CP 值）排序
    groups.sort((a,b) => sortAsc ? a.bestCp - b.bestCp : b.bestCp - a.bestCp);

    function renderRow(item, opts){
      const { isRep, multi, isBestOfGroup, sub } = opts;
      let tier;
      if(item.pending){
        tier = "gray";
      } else if(multi){
        const arr = groupsMap.get(item.name.trim().toLowerCase());
        const idx = arr.indexOf(item);
        if(idx === 0) tier = "green";
        else if(idx === arr.length - 1) tier = "red";
        else tier = "amber";
      } else {
        const cat = (item.categories || [])[0];
        const sameCategory = cat ? (categoryMap.get(cat) || []) : [];
        tier = tierFor(item, sameCategory);
      }

      const pctInfo = !item.pending ? percentileFor(item, categoryMap) : null;
      const rankBadge = pctInfo ? `<span class="rank-badge" title="在「${escapeHtml(pctInfo.cat)}」類別中的 CP 值排名">前 ${pctInfo.pct}% 划算</span>` : "";
      const bestBadge = (isBestOfGroup && !item.pending) ? `<span class="best-badge">🏆 ${isRep ? "最划算代表" : "組內最划算"}</span>` : "";
      const singleBadge = (isRep && multi && (item.count || 1) === 1) ? `<span class="best-badge">・1入</span>` : "";
      const rowClass = "receipt-row" + (item.pending ? " pending" : "") + (multi ? " grouped" : "") + (sub ? " sub-row" : "");
      const dateBadge = item.date ? `<span class="date-badge">${escapeHtml(item.date)}</span>` : "";
      const locationBadge = item.location ? `<span class="date-badge">${escapeHtml(item.location)}</span>` : "";
      const catBadges = (item.categories || []).map(c => `<span class="cat-badge">${escapeHtml(c)}</span>`).join("");
      const actions = item.pending
        ? (item.uploadError
            ? `<button class="del" data-row="${item.tempId}" title="上傳失敗，點擊移除">⚠</button>`
            : `<span class="pending-label" title="背景上傳中">⏳</span>`)
        : `<div class="row-actions">
             <button class="edit" data-row="${item.row}" title="編輯">✎</button>
             <button class="del" data-row="${item.row}" title="刪除">✕</button>
           </div>`;
      return `
        <div class="${rowClass}">
          <div class="name name-clickable" data-row="${item.row}" title="點擊進行快速比價">
            ${escapeHtml(item.name)} ${bestBadge}${singleBadge}${rankBadge}
            <span class="cat-badge-group">${catBadges}</span>
            ${dateBadge}
            ${locationBadge}
          </div>
          <div class="stats">
            <div class="stat grams-col mono"><span class="stat-label">克數</span><span class="stat-val">${formatNum(item.grams)}g</span></div>
            <div class="stat price-col mono"><span class="stat-label">總價</span><span class="stat-val">$${formatNum(item.price)}</span></div>
            <div class="stat count-col mono"><span class="stat-label">數量</span><span class="stat-val">${item.count}入</span></div>
            <div class="stat mono"><span class="stat-label">單罐價</span><span class="stat-val">$${formatNum(item.unitPrice)}</span></div>
          </div>
          <div class="cp-cell">
            <span class="stat-label mono">$/g</span>
            <span class="dot ${tier}"></span>
            <span class="cp-val mono">${item.cp.toFixed(3)}</span>
          </div>
          ${actions}
        </div>
      `;
    }

    tableBody.innerHTML = groups.map(group => {
      const { key, items: arr, rep, others } = group;
      const multi = arr.length > 1;
      const groupHeader = multi
        ? `<div class="group-header">📦 ${escapeHtml(arr[0].name)} · 共 ${arr.length} 種容量／數量／通路，預設顯示 1 入且最划算的紀錄</div>`
        : "";

      const repRow = renderRow(rep, { isRep: true, multi, isBestOfGroup: true, sub: false });

      let othersHtml = "";
      if(others.length){
        const expanded = expandedGroups.has(key);
        const toggleLabel = expanded
          ? `▴ 收合其他 ${others.length} 種容量／數量`
          : `▾ 查看其他 ${others.length} 種容量／數量／通路`;
        const subRows = others.map(item => renderRow(item, { isRep: false, multi, isBestOfGroup: false, sub: true })).join("");
        othersHtml = `
          <button type="button" class="sub-toggle" data-group="${escapeHtml(key)}">${toggleLabel}</button>
          <div class="sub-items" style="display:${expanded ? "block" : "none"};">${subRows}</div>
        `;
      }

      return `<div class="group-block">${groupHeader}${repRow}${othersHtml}</div>`;
    }).join("");

    tableBody.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", () => deleteItem(btn.dataset.row));
    });
    tableBody.querySelectorAll(".edit").forEach(btn => {
      btn.addEventListener("click", () => {
        const item = items.find(i => String(i.row) === btn.dataset.row);
        if(item) startEdit(item);
      });
    });
    tableBody.querySelectorAll(".name-clickable").forEach(el => {
      el.addEventListener("click", () => {
        const item = items.find(i => String(i.row) === el.dataset.row);
        if(item) openCompareModal(item);
      });
    });
    tableBody.querySelectorAll(".sub-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.group;
        if(expandedGroups.has(key)) expandedGroups.delete(key);
        else expandedGroups.add(key);
        renderTable();
      });
    });
  }

  function formatNum(n){
    if(Number.isInteger(n)) return n.toString();
    return n.toFixed(2).replace(/\.?0+$/, "");
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  // ---------- 啟動 ----------
  renderLocationOptions();

  const cached = localStorage.getItem(LS_CACHE_KEY);
  if(cached){
    try{
      items = JSON.parse(cached).map(migrateItem);
      renderLocationOptions();
      renderCategoryChips();
      renderTable();
    }catch(e){}
  }
  loadItems();

})();
</script>

</body>
</html>
