<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CP值紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EF;
    --paper-2:#F1ECDE;
    --line:#DCD3B8;
    --ink:#2B2820;
    --ink-soft:#7A7263;
    --red:#B7472A;
    --green:#3F6B4F;
    --amber:#B6862C;
    --gold:#C9A227;
    --white:#FFFDF8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(var(--line) 0.6px, transparent 0.6px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:'Space Mono', monospace;}

  /* ---------- header ---------- */
  header{
    max-width:880px;
    margin:0 auto;
    padding:36px 20px 18px;
    text-align:center;
  }
  header .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  header h1{
    font-size:clamp(28px, 6vw, 40px);
    margin:6px 0 4px;
    font-weight:900;
    letter-spacing:-.01em;
  }
  header p{
    color:var(--ink-soft);
    font-size:14px;
    margin:0;
  }

  main{
    max-width:880px;
    margin:0 auto;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* ---------- card base: price-tag paper ---------- */
  .tag-card{
    background:var(--white);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line), 0 8px 24px -18px rgba(43,40,32,.4);
    padding:22px 20px 24px;
    position:relative;
  }
  .tag-card::before{
    /* punch hole */
    content:"";
    position:absolute;
    top:-9px;
    left:50%;
    transform:translateX(-50%);
    width:18px;
    height:18px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:50%;
    box-shadow:0 0 0 4px var(--white);
  }
  .card-title{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-family:'Space Mono', monospace;
    margin:0 0 14px;
    text-align:center;
  }

  /* ---------- quick calculator ---------- */
  .calc-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
    align-items:end;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .field input, .field select{
    font-family:'Space Mono', monospace;
    font-size:17px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
    width:100%;
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  .calc-result{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:6px;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .stamp{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:24px;
    padding:10px 18px;
    border:3px solid var(--ink-soft);
    border-radius:10px;
    color:var(--ink-soft);
    transform:rotate(-3deg);
    transition:transform .15s ease, color .15s ease, border-color .15s ease;
    white-space:nowrap;
    text-align:center;
  }
  .stamp.show{transform:rotate(-3deg) scale(1);}
  .stamp small{
    display:block;
    font-size:10px;
    letter-spacing:.1em;
    font-weight:400;
    text-align:center;
    margin-top:2px;
  }
  .stamp .unit-p{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
    margin-top:4px;
  }

  /* ---------- add item form ---------- */
  form#addForm{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
  }
  form#addForm .field.full{grid-column:1/-1;}
  #addBtn{
    grid-column:1/-1;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:.04em;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:opacity .15s ease;
  }
  #addBtn:active{opacity:.7;}
  #addBtn:disabled{opacity:.5;cursor:not-allowed;}
  #cancelEditBtn{
    grid-column:1/-1;
    font-family:'Space Mono', monospace;
    font-size:13px;
    padding:9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    margin-top:-4px;
  }
  #formMsg{
    grid-column:1/-1;
    font-size:13px;
    text-align:center;
    min-height:16px;
    color:var(--ink-soft);
  }

  /* ---------- edit hint (shown when editing an existing item) ---------- */
  .edit-hint{
    grid-column:1/-1;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.03em;
    color:var(--amber);
    background:rgba(182,134,44,.1);
    border:1px dashed var(--amber);
    border-radius:8px;
    padding:8px 12px;
    text-align:center;
  }

  /* ---------- fixed editing panel (編輯時固定在畫面下方，不用往上滑) ---------- */
  #editBackdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(43,40,32,.4);
    z-index:490;
  }
  #addFormCard.editing-mode{
    position:fixed;
    left:16px;
    right:16px;
    bottom:14px;
    margin:0 auto;
    max-width:848px;
    max-height:80vh;
    overflow-y:auto;
    z-index:500;
    box-shadow:0 -14px 40px -10px rgba(43,40,32,.5), 0 1px 0 var(--line);
    animation:editSlideUp .18s ease;
  }
  #addFormCard.editing-mode::before{
    display:none;
  }
  @keyframes editSlideUp{
    from{ transform:translateY(16px); opacity:.6; }
    to{ transform:translateY(0); opacity:1; }
  }
  @media (max-width:560px){
    #addFormCard.editing-mode{
      left:8px;
      right:8px;
      bottom:8px;
      max-height:85vh;
    }
  }

  /* ---------- controls row ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .chip.sub{
    font-size:11px;
    padding:5px 10px;
    border-style:dashed;
  }
  .chip.sub.active{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--white);
  }
  #childCategoryChips{
    margin-top:8px;
  }
  #childCategoryChips:empty{margin-top:0;}
  #searchInput{
    font-family:'Noto Sans TC', sans-serif;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--white);
    min-width:150px;
    flex:1;
    max-width:220px;
  }
  #syncStatus{
    max-width:880px;
    width:calc(100% - 32px);
    box-sizing:border-box;
    margin:0 auto 18px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 16px;
    box-shadow:0 1px 0 var(--line), 0 6px 16px -12px rgba(43,40,32,.4);
  }
  #syncStatus .sync-dot{
    width:9px;
    height:9px;
    min-width:9px;
    border-radius:50%;
    background:var(--ink-soft);
    box-shadow:0 0 0 3px rgba(122,114,99,.15);
    transition:background .2s, box-shadow .2s;
  }
  #syncStatus.state-syncing .sync-dot{
    background:var(--amber);
    box-shadow:0 0 0 3px rgba(182,134,44,.18);
    animation:syncPulse 1s ease-in-out infinite;
  }
  #syncStatus.state-ok .sync-dot{
    background:var(--green);
    box-shadow:0 0 0 3px rgba(63,107,79,.16);
  }
  #syncStatus.state-error .sync-dot{
    background:var(--red);
    box-shadow:0 0 0 3px rgba(183,71,42,.16);
  }
  @keyframes syncPulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.4; }
  }
  #syncStatus .sync-main{
    display:flex;
    flex-direction:column;
    line-height:1.35;
    flex:1;
    min-width:0;
  }
  #syncStatus .sync-url{
    font-size:10px;
    color:var(--ink-soft);
    opacity:.7;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #refreshBtn{
    background:none;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 10px;
    cursor:pointer;
    font-size:14px;
    color:var(--ink-soft);
    flex:none;
  }

  /* ---------- receipt table ---------- */
  .receipt{
    background:var(--white);
    border-radius:var(--radius);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .receipt-row{
    display:grid;
    grid-template-columns:1.8fr .8fr .8fr .6fr .8fr .9fr .8fr;
    gap:6px;
    align-items:center;
    padding:12px 14px;
    border-bottom:1px dashed var(--line);
  }
  .receipt-row:last-child{border-bottom:none;}
  .receipt-row.head{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
  }
  .receipt-row .name{
    font-weight:500;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .receipt-row .name-clickable{
    cursor:pointer;
    padding:4px;
    margin:-4px;
    border-radius:6px;
    transition:background-color .15s ease;
  }
  .receipt-row .name-clickable:hover{
    background-color:var(--paper-2);
  }
  .receipt-row .name-clickable::after{
    content:" 🔍 比價";
    font-size:10px;
    color:var(--gold);
    opacity:0;
    transition:opacity .15s ease;
  }
  .receipt-row .name-clickable:hover::after{
    opacity:1;
  }
  .receipt-row .name .cat-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    width:fit-content;
  }
  .receipt-row .name .date-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    width:fit-content;
  }
  .receipt-row.pending{
    opacity:.55;
  }
  .receipt-row .pending-label{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--gold);
  }
  .receipt-row .num{
    font-family:'Space Mono', monospace;
    text-align:right;
    font-size:13px;
  }
  /* stats group: on desktop its children become normal grid cells (display:contents),
     on mobile it becomes a wrapping row of labeled chips */
  .receipt-row .stats{
    display:contents;
  }
  .receipt-row .stat{
    font-family:'Space Mono', monospace;
    text-align:right;
    font-size:13px;
  }
  .receipt-row .stat-label{
    display:none;
  }
  .receipt-row .stat-val{
    font-weight:400;
  }
  .receipt-row .cp-cell{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
  }
  .receipt-row .cp-cell .stat-label{
    margin-right:auto;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    flex-shrink:0;
  }
  .dot.green{background:var(--green);}
  .dot.amber{background:var(--amber);}
  .dot.red{background:var(--red);}
  .dot.gray{background:var(--ink-soft);}
  .receipt-row .cp-val{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:14px;
  }
  .receipt-row .del{
    background:none;
    border:none;
    color:var(--line);
    cursor:pointer;
    font-size:14px;
    padding:2px 4px;
  }
  .receipt-row .del:hover{color:var(--red);}
  .receipt-row .row-actions{
    display:flex;
    gap:2px;
    justify-content:flex-end;
  }
  .receipt-row .edit{
    background:none;
    border:none;
    color:var(--line);
    cursor:pointer;
    font-size:14px;
    padding:2px 4px;
  }
  .receipt-row .edit:hover{color:var(--ink);}
  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* ---------- grouped by product name (different sizes together) ---------- */
  .group-block + .group-block{
    border-top:6px solid var(--paper-2);
  }
  .group-header{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    background:var(--paper-2);
    padding:8px 14px;
    border-bottom:1px dashed var(--line);
  }
  .receipt-row.grouped{
    border-left:3px solid var(--line);
  }
  .best-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--green);
    margin-left:2px;
    white-space:nowrap;
  }
  .rank-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--white);
    background:var(--gold);
    padding:1px 7px;
    border-radius:999px;
    margin-left:2px;
    margin-top:2px;
    white-space:nowrap;
    display:inline-block;
  }
  .sub-toggle{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.03em;
    color:var(--ink-soft);
    background:var(--paper-2);
    border:none;
    border-top:1px dashed var(--line);
    width:100%;
    text-align:left;
    padding:8px 14px;
    cursor:pointer;
  }
  .sub-toggle:hover{color:var(--ink);}
  .sub-items{
    background:var(--paper);
  }
  .receipt-row.sub-row{
    padding-left:26px;
    background:var(--paper);
  }
  .receipt-row.sub-row .name{
    font-weight:400;
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ---------- category multi-select input ---------- */
  .cat-input-row{
    display:flex;
    gap:8px;
  }
  .cat-input-row select{flex:1;}
  .cat-input-row select:disabled{opacity:.5;}
  .cat-manual-btn{
    font-family:'Space Mono', monospace;
    font-size:12px;
    white-space:nowrap;
    padding:0 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .cat-manual-btn:hover{color:var(--ink); border-color:var(--ink);}
  .cat-manual-row{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .cat-manual-row input{
    flex:1;
    font-family:'Noto Sans TC', sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
  }
  .cat-manual-row button{
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:0 14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    cursor:pointer;
  }
  .receipt-row .name .cat-badge-group{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }

  /* ---------- child category checkboxes (勾選式子類別) ---------- */
  .cat-checkbox-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .cat-checkbox-list:empty::after{
    content:"目前這個主類別還沒有子類別，可用下方按鈕新增";
    font-size:12px;
    color:var(--ink-soft);
  }
  .cat-checkbox-item{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
    transition:background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .cat-checkbox-item input{
    accent-color:var(--amber);
    cursor:pointer;
    margin:0;
  }
  .cat-checkbox-item.checked{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--white);
  }
  #categoryChildManualBtn{
    margin-top:10px;
  }

  /* ---------- live rank preview（即時排名預覽） ---------- */
  .live-rank-preview{
    display:none;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:11px;
    color:var(--ink-soft);
  }
  .live-rank-preview.show{display:flex;}
  .live-rank-preview .live-rank-label{
    font-family:'Space Mono', monospace;
    letter-spacing:.04em;
  }
  .rank-badge.live{
    background:var(--green);
  }

  /* ---------- category average stats bar ---------- */
  #categoryStatsBar{
    display:none;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 16px;
    text-align:center;
  }
  #categoryStatsBar.show{display:block;}
  #categoryStatsBar strong{color:var(--ink);}

  /* ---------- settings ---------- */
  details#settings{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 18px;
  }
  details#settings summary{
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.06em;
  }
  .settings-body{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .settings-body input{
    font-family:'Space Mono', monospace;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    width:100%;
  }
  .settings-body button{
    align-self:flex-start;
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:8px 14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    cursor:pointer;
  }
  .settings-body p{
    font-size:12px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.6;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Space Mono', monospace;
    margin-top:30px;
  }

  /* ---------- mobile ---------- */
  @media (max-width:560px){
    .receipt-row.head{display:none;} /* labels now shown inline per row instead */

    .receipt-row{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px 10px;
      font-size:12px;
      padding:14px;
    }
    .receipt-row .name{
      flex:0 0 100%;
    }
    .receipt-row .stats{
      display:flex;
      flex-wrap:wrap;
      flex:0 0 100%;
      gap:6px 16px;
    }
    .receipt-row .stat{
      display:flex;
      align-items:baseline;
      gap:4px;
      text-align:left;
    }
    .receipt-row .stat-label{
      display:inline;
      font-size:10px;
      letter-spacing:.04em;
      color:var(--ink-soft);
    }
    .receipt-row .stat-val{
      font-weight:700;
      font-size:13px;
    }
    .receipt-row .cp-cell{
      flex:1 1 auto;
      justify-content:flex-start;
      gap:8px;
      padding-top:8px;
      border-top:1px dashed var(--line);
    }
    .receipt-row .cp-cell .stat-label{
      display:inline;
      margin-right:0;
    }
    .receipt-row .cp-val{
      font-size:15px;
    }
    .receipt-row .row-actions,
    .receipt-row .pending-label,
    .receipt-row > .del{
      flex:0 0 auto;
      margin-left:auto;
      padding-top:8px;
      border-top:1px dashed var(--line);
    }

    form#addForm{grid-template-columns:1fr 1fr 1fr;}

  }
</style>

<script>
(function(){
  "use strict";

  const LS_URL_KEY = "cp_tracker_script_url";
  const LS_CACHE_KEY = "cp_tracker_cache";
  const LS_LOCATIONS_KEY = "cp_tracker_custom_locations";

  // 預設同步網址
  const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4SLRn8eRvg9pP4rrptYfbgIt3W5en2vrrfyUJG2SxpenrZp4D07wuRKiZDbIoMDq7/exec";

  // 預設預設選單地點
  const DEFAULT_LOCATIONS = [
    "全聯線上", "全聯", "家樂福線上", "PChome", "MoMo", "蝦皮", 
    "LG生活", "花王特賣", "康是美", "寶雅", "寶雅線上", "屈臣氏"
  ];

  let scriptUrl = localStorage.getItem(LS_URL_KEY) || DEFAULT_SCRIPT_URL;
  let customLocations = JSON.parse(localStorage.getItem(LS_LOCATIONS_KEY) || "[]");
  let items = [];
  let activeCategory = "__all__";
  let searchTerm = "";
  let sortAsc = true;
  let expandedGroups = new Set();

  const $ = (id) => document.getElementById(id);
  const scriptUrlInput = $("scriptUrl");
  const tableBody = $("tableBody");
  const syncStatusEl = $("syncStatus");
  const syncText = $("syncText");
  const syncUrlDisplay = $("syncUrlDisplay");
  const categoryChips = $("categoryChips");
  const formMsg = $("formMsg");
  const addBtn = $("addBtn");
  const categoryStatsBar = $("categoryStatsBar");

  scriptUrlInput.value = scriptUrl;

  // 同步狀態列：更新圓點顏色 + 顯示目前使用的同步網址
  function setSyncState(state, text){
    syncStatusEl.classList.remove("state-syncing", "state-ok", "state-error");
    if(state) syncStatusEl.classList.add("state-" + state);
    if(text !== undefined) syncText.textContent = text;
    syncUrlDisplay.textContent = scriptUrl
      ? ("已連接 · " + scriptUrl.replace(/^https?:\/\//, ""))
      : "尚未設定同步網址";
  }
  setSyncState(null, "尚未同步");

  // ---------- 類別（主類別 必填／子類別 選填、可複選）管理 ----------
  // 邏輯：每筆紀錄一定要有一個主類別，子類別可以不選、選一個、或選多個。
  // 例如：果凍 → 主類別「零食」、子類別「甜的」「健康的」；子類別留空就只算在主類別底下。
  // 子類別的建議選項一律只從「目前實際存在的資料」彙整出來，不提供任何預設／假想的選項，
  // 所以新類別一開始不會有任何子類別可選，要靠使用者自己新增。
  const CATEGORY_SEP = "/";

  function splitCategoryPath(path){
    const s = String(path || "");
    const idx = s.indexOf(CATEGORY_SEP);
    if(idx === -1) return { parent: s, child: "" };
    return { parent: s.slice(0, idx), child: s.slice(idx + 1) };
  }

  function joinCategoryPath(parent, child){
    return child ? (parent + CATEGORY_SEP + child) : parent;
  }

  // 把一筆紀錄的子類別欄位（試算表裡是逗號分隔的字串）拆成陣列
  function subCategoriesOf(item){
    const raw = item && item.subCategory ? String(item.subCategory) : "";
    return raw.split(",").map(s => s.trim()).filter(Boolean);
  }

  // 品項實際所屬的完整類別路徑清單：每個子類別各自一條「主類別/子類別」路徑，
  // 若完全沒有子類別，就只有一條「主類別」路徑
  function itemCategoryPaths(item){
    if(!item || !item.category) return [];
    const subs = subCategoriesOf(item);
    if(subs.length === 0) return [item.category];
    return subs.map(s => joinCategoryPath(item.category, s));
  }

  // 用於單一顏色分級（tier）等只需要「代表路徑」的情境，取第一個子類別路徑
  function itemPrimaryCategoryPath(item){
    const paths = itemCategoryPaths(item);
    return paths.length ? paths[0] : "";
  }

  // 依目前所有紀錄動態彙整出「主類別 -> 子類別清單」，只反映實際存在的資料，沒有任何預設選項
  function buildCategoryTree(){
    const tree = new Map();
    items.forEach(i => {
      if(!i.category) return;
      if(!tree.has(i.category)) tree.set(i.category, new Set());
      subCategoriesOf(i).forEach(c => tree.get(i.category).add(c));
    });
    return tree;
  }

  // filterValue 為 "__all__"、單一主類別（例如「零食」）、或完整路徑（例如「零食/甜的」）
  function categoryMatches(item, filterValue){
    if(filterValue === "__all__") return true;
    const { parent, child } = splitCategoryPath(filterValue);
    if(item.category !== parent) return false;
    if(!child) return true;
    return subCategoriesOf(item).includes(child);
  }

  const categoryParentSelect = $("categoryParentSelect");
  const categoryParentManualBtn = $("categoryParentManualBtn");
  const categoryParentManualRow = $("categoryParentManualRow");
  const categoryParentManualInput = $("categoryParentManualInput");
  const categoryParentManualAddBtn = $("categoryParentManualAddBtn");
  const categoryChildCheckboxes = $("categoryChildCheckboxes");
  const categoryChildManualBtn = $("categoryChildManualBtn");
  const categoryChildManualRow = $("categoryChildManualRow");
  const categoryChildManualInput = $("categoryChildManualInput");
  const categoryChildManualAddBtn = $("categoryChildManualAddBtn");
  const subCategorySearchInput = $("subCategorySearchInput");
  const subCategorySearchList = $("subCategorySearchList");

  // 目前表單上已選取的子類別（可複選）
  let selectedSubCategories = [];

  // 依目前所有資料，彙整「子類別名稱 -> 有出現這個子類別的主類別清單」反向對照表，
  // 用於「依子類別搜尋帶入主類別」：使用者只記得子類別（例如「甜的」），
  // 系統就能自動幫忙選好對應的主類別，不用自己想主類別叫什麼
  function buildSubCategoryReverseMap(){
    const map = new Map();
    items.forEach(i => {
      if(!i.category) return;
      subCategoriesOf(i).forEach(sub => {
        if(!map.has(sub)) map.set(sub, new Set());
        map.get(sub).add(i.category);
      });
    });
    return map;
  }

  // 重新整理子類別搜尋欄位的建議清單（datalist），列出目前所有實際存在的子類別名稱
  function renderSubCategorySearchList(){
    const map = buildSubCategoryReverseMap();
    const subs = Array.from(map.keys()).sort();
    subCategorySearchList.innerHTML = subs.map(s => `<option value="${escapeHtml(s)}"></option>`).join("");
  }

  // 使用者在子類別搜尋欄位輸入（或從建議清單選擇）一個已存在的子類別名稱時，
  // 自動把對應的主類別帶入「主類別」下拉選單，並直接勾選這個子類別；
  // 如果同一個子類別名稱出現在多個不同主類別底下，預設帶入第一個（依字母排序），並在訊息裡提醒還有哪些主類別也有這個子類別
  function applySubCategorySearch(){
    const term = subCategorySearchInput.value.trim();
    if(!term) return;
    const map = buildSubCategoryReverseMap();
    if(!map.has(term)){
      formMsg.textContent = `找不到子類別「${term}」，可以直接在下方主類別／子類別欄位手動輸入新的`;
      return;
    }
    const parents = Array.from(map.get(term)).sort();
    const parent = parents[0];
    categoryParentSelect.value = parent;
    renderChildCheckboxes();
    addSelectedSubCategory(term);
    subCategorySearchInput.value = "";
    formMsg.textContent = parents.length > 1
      ? `已帶入主類別「${parent}」（子類別「${term}」也出現在：${parents.join("、")}，如需其他請手動切換主類別）`
      : `已自動帶入主類別「${parent}」`;
  }

  subCategorySearchInput.addEventListener("change", applySubCategorySearch);
  subCategorySearchInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      applySubCategorySearch();
    }
  });

  // 依目前資料重新整理「主類別」下拉選單，並盡量保留使用者目前選到（或剛手動新增）的值，
  // 就算這個主類別還沒有任何一筆紀錄（剛手動新增、尚未送出表單）也不會被清掉
  function renderCategoryDatalists(){
    const tree = buildCategoryTree();
    const parents = Array.from(tree.keys()).sort();
    const current = categoryParentSelect.value;
    let optionsHtml = '<option value="">-- 選擇主類別 --</option>' +
      parents.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
    if(current && !parents.includes(current)){
      optionsHtml += `<option value="${escapeHtml(current)}">${escapeHtml(current)}</option>`;
    }
    categoryParentSelect.innerHTML = optionsHtml;
    categoryParentSelect.value = current;
    renderSubCategorySearchList();
    renderChildCheckboxes();
  }

  // 依目前選取的主類別，重新整理子類別勾選清單：只列出「已經存在」的子類別（完全沒有任何預設選項），
  // 勾選狀態依 selectedSubCategories 而定；沒有任何可選的子類別時清單留空，仍可用「新增子類別」手動加入
  function renderChildCheckboxes(){
    const tree = buildCategoryTree();
    const parent = categoryParentSelect.value.trim();
    const existing = parent && tree.has(parent) ? Array.from(tree.get(parent)) : [];
    // 保留目前已勾選但尚未存在於資料裡的子類別（例如剛手動新增、尚未送出表單）
    const all = Array.from(new Set([...existing, ...selectedSubCategories])).sort();
    categoryChildCheckboxes.innerHTML = all.map(c => {
      const checked = selectedSubCategories.includes(c);
      return `<label class="cat-checkbox-item${checked ? " checked" : ""}">
        <input type="checkbox" value="${escapeHtml(c)}" ${checked ? "checked" : ""}>
        ${escapeHtml(c)}
      </label>`;
    }).join("");
  }

  function addSelectedSubCategory(name){
    const c = String(name || "").trim();
    if(!c || selectedSubCategories.includes(c)) return;
    selectedSubCategories.push(c);
    renderChildCheckboxes();
    updateLiveRank();
  }

  function removeSelectedSubCategory(name){
    selectedSubCategories = selectedSubCategories.filter(c => c !== name);
    renderChildCheckboxes();
    updateLiveRank();
  }

  categoryChildCheckboxes.addEventListener("change", (e) => {
    const cb = e.target.closest('input[type="checkbox"]');
    if(!cb) return;
    if(cb.checked) addSelectedSubCategory(cb.value);
    else removeSelectedSubCategory(cb.value);
  });

  categoryParentSelect.addEventListener("change", () => {
    renderChildCheckboxes();
    updateLiveRank();
  });

  categoryParentManualBtn.addEventListener("click", () => {
    const showing = categoryParentManualRow.style.display !== "none";
    categoryParentManualRow.style.display = showing ? "none" : "flex";
    if(!showing) categoryParentManualInput.focus();
  });

  function addManualParentCategory(){
    const name = categoryParentManualInput.value.trim();
    if(!name) return;
    if(!Array.from(categoryParentSelect.options).some(o => o.value === name)){
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      categoryParentSelect.appendChild(opt);
    }
    categoryParentSelect.value = name;
    categoryParentManualInput.value = "";
    categoryParentManualRow.style.display = "none";
    renderChildCheckboxes();
    updateLiveRank();
  }

  categoryParentManualAddBtn.addEventListener("click", addManualParentCategory);
  categoryParentManualInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      addManualParentCategory();

  function updateCalc(){
    const g = parseFloat(itemGramsInput.value);

    if(g > 0 && p >= 0 && count > 0 && !isNaN(g) && !isNaN(p)){

  // 依目前輸入的克數／總價／數量／主類別／子類別，即時試算「如果現在把這筆存進去，
  // 在所屬類別（主類別，以及每個已選子類別）中 CP 值大約會排第幾名」，還沒送出表單就能看到，
  // 若是在編輯既有紀錄，會先把該筆自己從比較清單中排除，避免跟自己比較。
  function updateLiveRank(){
    const g = parseFloat(itemGramsInput.value);
    const p = parseFloat(itemPriceInput.value);
    const count = parseInt(itemCountInput.value, 10) || 1;
    const category = categoryParentSelect.value.trim();

    if(!(g > 0) || isNaN(p) || p < 0 || count < 1 || !category){
      liveRankPreview.innerHTML = "";
      liveRankPreview.classList.remove("show");
      return;
    }

    const cp = p / (g * count);
    const paths = selectedSubCategories.length
      ? selectedSubCategories.map(s => joinCategoryPath(category, s))
      : [category];

    const categoryMap = buildCategoryMap();
    const badges = paths.map(path => {
      const group = (categoryMap.get(path) || []).filter(i => editingRow === null || i.row !== editingRow);
      const cps = group.map(i => i.cp);
      cps.push(cp);
      cps.sort((a, b) => a - b);
      const rank = cps.indexOf(cp) + 1;
      const total = cps.length;
      const { parent, child } = splitCategoryPath(path);
      const label = child ? `${escapeHtml(parent)}▸${escapeHtml(child)}` : escapeHtml(parent);
      return `<span class="rank-badge live" title="假設現在把這筆存進去，在這個類別中依 CP 值由低到高估算的名次">${label} 預估第${rank}名／${total}</span>`;
    });

    liveRankPreview.innerHTML = `<span class="live-rank-label">即時排名預覽：</span>` + badges.join("");

  }

  // ---------- 購買地點（記憶與動態渲染） ----------

  // ---------- 快速比價 Modal 邏輯 ----------
  const compareModal = $("compareModal");

  const modalSaveBtn = $("modalSaveBtn");
  const modalSaveMsg = $("modalSaveMsg");

  let activeCompareCp = 0;
  let activeCompareItem = null;
  const EPSILON = 0.05; // 價格容許誤差（四捨五入/浮點數用），在此範圍內視為「一樣划算」

  function openCompareModal(item){

  function resetResult(){
    modalTargetLabel.textContent = "等比例目標";
    modalTargetValue.textContent = "--";

    modalUnitCp.style.display = "none";
    modalVerdict.style.display = "none";
    modalSaveSection.style.display = "none";

  function calcComparison(){
    const gramsRaw = modalGrams.value.trim();
    const priceRaw = modalPrice.value.trim();
    const countRaw = modalCount.value.trim();

    const newGrams = parseFloat(gramsRaw);
    const newPrice = parseFloat(priceRaw);
    // 數量至少為 1，避免使用者清空或輸入 0 / 負數時算式壞掉
    let newCount = parseInt(countRaw, 10);
    if(!(newCount > 0)) newCount = 1;

    const hasGrams = gramsRaw !== "" && newGrams > 0 && !isNaN(newGrams);
    const hasPrice = priceRaw !== "" && !isNaN(newPrice) && newPrice >= 0;
    const hasBaseCp = activeCompareCp > 0;

    resetResult();

    if(!hasBaseCp || (!hasGrams && !hasPrice)){
      return;
    }

    if(hasGrams){
      // 已知「單件容量 × 數量」→ 反推打平所需的售價（目標售價）
      const targetPrice = activeCompareCp * newGrams * newCount;
      modalTargetLabel.textContent = "等比例目標價";
      modalTargetValue.textContent = "$" + targetPrice.toFixed(1);

      if(hasPrice){
        // 兩邊都填了，直接算出這次交易實際的 CP 值，並跟基準比較
        const newCp = newPrice / (newGrams * newCount);
        modalUnitCp.style.display = "block";
        modalUnitCpVal.textContent = newCp.toFixed(3);

        modalVerdict.style.display = "block";
        const diff = newPrice - targetPrice;
        if(diff < -EPSILON){
          modalVerdict.textContent = "🎉 更划算！(省 $" + Math.abs(diff).toFixed(1) + ")";
          modalVerdict.style.color = "var(--green)";
          modalVerdict.style.borderColor = "var(--green)";
          modalSaveLabel.textContent = "🎉 更划算！在哪裡找到這個價格？";
          modalSaveSection.style.display = "block";
        } else if(diff > EPSILON){
          modalVerdict.textContent = "❌ 買貴了！(貴 $" + diff.toFixed(1) + ")";
          modalVerdict.style.color = "var(--red)";
          modalVerdict.style.borderColor = "var(--red)";
        } else {
          modalVerdict.textContent = "⚖ 劃算度相同";
          modalVerdict.style.color = "var(--ink-soft)";
          modalVerdict.style.borderColor = "var(--ink-soft)";
          // 划算度相同，也是多一個可以比價的通路／容量選擇，一樣可以存成新的一筆紀錄
          modalSaveLabel.textContent = "⚖ 划算度相同，也想記錄這個通路／容量嗎？";
          modalSaveSection.style.display = "block";
        }
      } else {
        modalTargetHint.style.display = "block";
        modalTargetHint.textContent = "填入現場售價即可看到判斷結果";
      }
    } else {
      // 沒有（或還不知道）容量，但已知數量與售價 → 反推打平所需的容量（目標容量）
      const targetGrams = newPrice / (activeCompareCp * newCount);
      modalTargetLabel.textContent = "目標容量";
      modalTargetValue.textContent = (targetGrams > 0 ? targetGrams.toFixed(1) : "0") + " g(ml)";
      modalTargetHint.style.display = "block";
      modalTargetHint.textContent = "容量 ≥ 這個數字才划算，找到包裝標示的容量後可填入比對";
    }
  }

  modalGrams.addEventListener("input", calcComparison);

    const subCategory = activeCompareItem.subCategory || "";

    tempIdCounter += 1;

    items.unshift({
      row: tempId,

  // ---------- 設定 ----------
  $("saveUrlBtn").addEventListener("click", () => {

  // ---------- 讀取資料 ----------
  // 帶重試與更清楚錯誤訊息的 JSON 讀取（Apps Script 偶爾會回傳 HTML 而非 JSON）
  async function fetchJson(url, options, retries){
    if(retries === undefined) retries = 1;
    let lastErr;
    for(let attempt = 0; attempt <= retries; attempt++){
      try{
        const res = await fetch(url, options);
        const text = await res.text();
        try{
          return JSON.parse(text);
        }catch(parseErr){
          if(text.trim().slice(0, 1) === "<"){
            throw new Error("Google 回傳了網頁而非資料，可能是 Apps Script 部署權限（需設為「任何人」）或暫時性問題");
          }
          throw parseErr;
        }
      }catch(err){
        lastErr = err;
        if(attempt < retries){
          await new Promise(r => setTimeout(r, 700));
          continue;
        }
      }
    }
    throw lastErr;
  }

  async function loadItems(){
    if(!scriptUrl){
      tableBody.innerHTML = '<div class="empty-state">請先在下方「設定」貼上你的 Google Apps Script 網址</div>';
      setSyncState(null, "尚未設定同步網址");
      return;
    }
    setSyncState("syncing", "同步中…");
    try{
      const data = await fetchJson(scriptUrl + "?t=" + Date.now());
      if(data.status !== "ok") throw new Error(data.message || "讀取失敗");
      const serverItems = (data.items || []).map(normalizeItem);
      const stillPending = items.filter(i => i.pending && uploadQueue.some(j => j.tempId === i.tempId));
      items = [...stillPending, ...serverItems];
      localStorage.setItem(LS_CACHE_KEY, JSON.stringify(serverItems));
      setSyncState("ok", "已同步 · " + new Date().toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"}));
      renderLocationOptions();
      renderCategoryChips();
      renderTable();
    }catch(err){
      const cached = localStorage.getItem(LS_CACHE_KEY);
      if(cached){
        items = JSON.parse(cached).map(migrateItem);
        renderLocationOptions();
        renderCategoryChips();
        renderTable();
      }
      setSyncState("error", "同步失敗，顯示上次快取（" + err.message + "）");
    }
  }

  // 相容舊版快取資料（舊版是可複選的 categories 陣列，例如 ["零食/甜的"]）
  // 新版一筆紀錄只有一個主類別 + 一個選填子類別，取舊資料的第一個當作主／子類別
  function migrateItem(item){
    if(item.category === undefined || item.category === null){
      if(item.categories && item.categories.length){
        const { parent, child } = splitCategoryPath(item.categories[0]);
        item.category = parent || "未分類";
        item.subCategory = item.subCategory || child || "";
      } else {
        item.category = "未分類";
      }
    }
    if(item.subCategory === undefined || item.subCategory === null) item.subCategory = "";
    delete item.categories;
    return item;
  }

  function normalizeItem(raw){
    const grams = Number(raw["克數"]);
    const price = Number(raw["價格"]);
    const count = Number(raw["數量"]) || 1;
    const unitPrice = raw["單罐價格"] !== undefined && raw["單罐價格"] !== "" ? Number(raw["單罐價格"]) : (count > 0 ? price / count : price);
    const cp = (grams * count) > 0 ? price / (grams * count) : 0;
    const category = String(raw["類別"] || "").trim();
    const subCategory = String(raw["子類別"] || "").trim();
    return {
      row: raw["_row"],
      name: raw["品項名稱"] || "",
      category: category || "未分類",
      subCategory: subCategory,
      grams: grams,
      price: price,
      count: count,
      unitPrice: unitPrice,
      cp: cp,
      date: raw["日期"] || "",
      location: raw["地點"] || "",
      pending: false
    };
  }

  const uploadQueue = [];

  let tempIdCounter = 0;

  function updateQueueStatus(){
    const n = uploadQueue.length + (isProcessingQueue ? 1 : 0);
    if(n > 0){
      setSyncState("syncing", "背景上傳中…（剩餘 " + n + " 筆）");
    }
  }

  // 新增品項送出後，Apps Script 會直接回傳這筆資料實際寫入的列號（row），
  // 前端就能直接把暫存項目（pending-N）換成真正的列號，不必再整張表重新讀取一次，
  // 大幅減少每次新增要等待的 Apps Script 呼叫次數。
  async function processQueue(){
    if(isProcessingQueue) return;
    isProcessingQueue = true;
    let anySucceeded = false;
    while(uploadQueue.length > 0){
      const job = uploadQueue[0];
      updateQueueStatus();
      const stillPending = items.find(i => i.tempId === job.tempId);
      try{
        const res = await fetch(scriptUrl, {
          method: "POST",
          headers: {"Content-Type": "text/plain;charset=utf-8"},
          body: JSON.stringify({
            action: "add",
            name: job.name,
            category: job.category,
            subCategory: job.subCategory,
            grams: job.grams,
            price: job.price,
            count: job.count,
            unitPrice: job.unitPrice,
            date: job.date,
            location: job.location
          })
        });
        const data = JSON.parse(await res.text());
        if(data.status !== "ok") throw new Error(data.message || "新增失敗");
        job.failed = false;
        anySucceeded = true;
        if(stillPending && data.row){
          stillPending.row = data.row;
          stillPending.pending = false;
          delete stillPending.tempId;
        }
      }catch(err){
        job.failed = true;
        if(stillPending){
          stillPending.uploadError = true;
        }
        renderTable();
      }
      uploadQueue.shift();
    }
    isProcessingQueue = false;
    renderTable();
    if(anySucceeded){
      setSyncState("ok", "已同步 · " + new Date().toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"}));
    }
  }

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();

    const subCategory = selectedSubCategories.join(",");
    const grams = parseFloat($("itemGrams").value);
    const price = parseFloat($("itemPrice").value);
    const count = parseInt($("itemCount").value, 10) || 1;
    const date = itemDateInput.value || "";
    const location = getLocationValue(itemLocationSelect, itemLocationCustom);
    if(!name || !category || !(grams > 0) || isNaN(price) || price < 0 || count < 1){
      formMsg.textContent = "請確認欄位都已正確填寫（主類別為必填，子類別可留空）";
      categoryParentSelect.reportValidity && categoryParentSelect.reportValidity();
      return;

    if(itemLocationSelect.value === "自行輸入" && !location){
      formMsg.textContent = "請輸入購買地點，或改選其他選項";
      return;
    }

    // 儲存新輸入的地點並刷新下拉選單
    saveCustomLocation(location);

    const unitPrice = price / count;
    const cp = price / (grams * count);

    if(editingRow !== null){

      return;
    }

    tempIdCounter += 1;
    const tempId = "pending-" + tempIdCounter;

    items.unshift({

  // ---------- 編輯品項 ----------
  const formTitle = $("formTitle");
  const cancelEditBtn = $("cancelEditBtn");
  const addFormCard = $("addFormCard");
  const editBackdrop = $("editBackdrop");
  const editHint = $("editHint");
  let editingRow = null;

  function startEdit(item){
    editingRow = item.row;
    $("itemGrams").value = item.grams;
    $("itemPrice").value = item.price;
    $("itemCount").value = item.count || 1;
    $("itemName").value = item.name;
    // 把這筆紀錄現有的主類別／子類別帶入表單，例如「果凍」→ 主類別「零食」、子類別「甜的」「健康的」，
    // 這樣編輯時可以直接看到、也可以直接修改子類別，儲存時會一併更新回試算表
    selectedSubCategories = subCategoriesOf(item);
    renderCategoryDatalists();
    categoryParentSelect.value = item.category || "";
    renderChildCheckboxes();
    itemDateInput.value = item.date || new Date().toISOString().slice(0, 10);
    setLocationValue(itemLocationSelect, itemLocationCustom, item.location || "");
    updateCalc();
    formTitle.textContent = "編輯品項";
    addBtn.textContent = "更新紀錄";
    cancelEditBtn.style.display = "block";
    formMsg.textContent = "";
    editHint.textContent = `✎ 正在編輯「${item.name}」，改完按「更新紀錄」即可，不用捲動頁面`;
    editHint.style.display = "block";
    // 編輯表單固定在畫面下方，點列表其他項目時不用再往上滑
    addFormCard.classList.add("editing-mode");
    editBackdrop.style.display = "block";
    $("itemGrams").focus();
  }

  function endEdit(){
    editingRow = null;
    $("addForm").reset();
    $("itemCount").value = "1";
    itemDateInput.value = new Date().toISOString().slice(0, 10);
    setLocationValue(itemLocationSelect, itemLocationCustom, "");
    resetCategorySelection();
    updateCalc();
    formTitle.textContent = "新增品項";
    addBtn.textContent = "加入紀錄";
    cancelEditBtn.style.display = "none";
    editHint.style.display = "none";
    addFormCard.classList.remove("editing-mode");
    editBackdrop.style.display = "none";
  }

  cancelEditBtn.addEventListener("click", endEdit);
  editBackdrop.addEventListener("click", endEdit);

  // 編輯後不再整張表重新讀取一次（那是造成「修改後同步很久」的主因：
  // 原本會先送出更新，再多打一次讀取整張試算表的請求，兩次 Apps Script 呼叫疊在一起才慢）。
  // 現在畫面已經用本地資料樂觀更新過了，背景只需要送出這一筆更新即可，不用再等一次全表讀取。
  function submitUpdate(rowRaw, fields){
    const row = Number(rowRaw);
    const target = items.find(i => i.row === row);
    if(target){
      target.name = fields.name;
      target.category = fields.category;
      target.subCategory = fields.subCategory;
      target.grams = fields.grams;
      target.price = fields.price;
      target.count = fields.count;
      target.unitPrice = fields.unitPrice;
      target.cp = fields.price / (fields.grams * fields.count);
      target.date = fields.date;
      target.location = fields.location;
      target.updating = true;
    }
    renderLocationOptions();
    renderCategoryChips();
    renderTable();
    endEdit();
    formMsg.textContent = "";
    setSyncState("syncing", "背景更新中…");

    fetch(scriptUrl, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({ action: "update", row, ...fields })
    }).then(async (res) => {
      let ok = true;
      try{
        const data = JSON.parse(await res.text());
        ok = data.status === "ok";
        if(!ok && target) target.uploadError = true;
      }catch(parseErr){ /* 忽略解析錯誤，畫面已是最新資料 */ }
      if(target) target.updating = false;
      setSyncState(ok ? "ok" : "error", ok
        ? ("已同步 · " + new Date().toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"}))
        : "更新可能失敗，請按 ↻ 重新整理確認");
      renderTable();
    }).catch((err) => {
      if(target) target.updating = false;
      setSyncState("error", "更新失敗：" + err.message);
      renderTable();
    });
  }

  // ---------- 刪除品項 ----------
  // 同樣道理：刪除後直接在本地移除該筆，並把後面列號的紀錄往前挪一格（試算表刪除列會讓後面的列號往上移），
  // 不再多打一次全表讀取，刪除的回應速度會快很多。
  async function deleteItem(rowRaw){
    if(String(rowRaw).startsWith("pending-")){
      items = items.filter(i => i.row !== rowRaw);
      renderTable();
      return;
    }
    if(!scriptUrl) return;
    if(!confirm("確定要刪除這筆紀錄嗎？")) return;

    // 按鈕上的 data-row 屬性一律是字串，本地資料的 row 是數字，這裡統一轉成數字再比對，
    // 不然本地陣列永遠找不到要刪除的那一筆，畫面就得等重新整理才會消失
    const row = Number(rowRaw);
    const idx = items.findIndex(i => i.row === row);
    const backup = idx !== -1 ? items[idx] : null;
    if(idx !== -1) items.splice(idx, 1);
    // 試算表刪除列後，原本列號比被刪除列大的紀錄都要往前挪一格，本地資料才會對得上
    items.forEach(i => { if(typeof i.row === "number" && i.row > row) i.row -= 1; });

    renderLocationOptions();
    renderCategoryChips();
    renderTable();
    setSyncState("syncing", "背景刪除中…");

    try{
      const res = await fetch(scriptUrl, {
        method: "POST",
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({ action: "delete", row })
      });
      let ok = true;
      try{ ok = JSON.parse(await res.text()).status === "ok"; }catch(parseErr){}
      setSyncState(ok ? "ok" : "error", ok
        ? ("已同步 · " + new Date().toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"}))
        : "刪除可能失敗，請按 ↻ 重新整理確認");
    }catch(err){
      // 失敗就還原本地狀態，避免畫面跟試算表不一致
      if(backup){
        items.forEach(i => { if(typeof i.row === "number" && i.row >= row) i.row += 1; });
        items.splice(idx, 0, backup);
      }
      renderLocationOptions();
      renderCategoryChips();
      renderTable();
      setSyncState("error", "刪除失敗：" + err.message);
      alert("刪除失敗：" + err.message);
    }
  }

  // ---------- 類別篩選（主類別 + 子類別兩層） ----------
  const childCategoryChips = $("childCategoryChips");

  function renderCategoryChips(){
    renderCategoryDatalists();

    const tree = buildCategoryTree();
    const parents = Array.from(tree.keys()).sort();
    const activeInfo = splitCategoryPath(activeCategory === "__all__" ? "" : activeCategory);
    const activeParent = activeCategory === "__all__" ? "" : activeInfo.parent;

    // ---- 主類別列 ----
    categoryChips.innerHTML = "";
    const allChip = document.createElement("button");
    allChip.className = "chip" + (activeCategory === "__all__" ? " active" : "");
    allChip.textContent = "全部";
    allChip.dataset.cat = "__all__";
    allChip.addEventListener("click", () => { activeCategory = "__all__"; renderCategoryChips(); renderTable(); });
    categoryChips.appendChild(allChip);
    parents.forEach(p => {
      const chip = document.createElement("button");
      chip.className = "chip" + (activeParent === p ? " active" : "");
      chip.textContent = p;
      chip.dataset.cat = p;
      chip.addEventListener("click", () => { activeCategory = p; renderCategoryChips(); renderTable(); });
      categoryChips.appendChild(chip);
    });

    // ---- 子類別列：只在選了某個主類別時顯示 ----
    childCategoryChips.innerHTML = "";
    if(activeParent && tree.has(activeParent)){
      const children = Array.from(tree.get(activeParent)).sort();
      children.forEach(c => {
        const fullPath = joinCategoryPath(activeParent, c);
        const chip = document.createElement("button");
        chip.className = "chip sub" + (activeCategory === fullPath ? " active" : "");
        chip.textContent = c;
        chip.dataset.cat = fullPath;
        chip.addEventListener("click", () => {
          activeCategory = (activeCategory === fullPath) ? activeParent : fullPath;
          renderCategoryChips();
          renderTable();
        });
        childCategoryChips.appendChild(chip);
      });
    }
  }

  $("searchInput").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderTable();
  });

  const sortToggleBtn = $("sortToggleBtn");
  sortToggleBtn.addEventListener("click", () => {
    sortAsc = !sortAsc;
    sortToggleBtn.textContent = sortAsc ? "CP值 低→高 ↑" : "CP值 高→低 ↓";
    renderTable();
  });

  // ---------- 表格渲染 ----------

  // 依「主類別/子類別」完整路徑建立分組，用來算同類別內的 CP 值排名。
  // 有多個子類別的品項會同時被歸進每一個子類別的分組（例如「甜的」跟「健康的」都各算一組排名）。
  function buildCategoryMap(){
    const map = new Map();
    items.forEach(i => {
      if(i.pending) return;
      itemCategoryPaths(i).forEach(path => {
        if(!map.has(path)) map.set(path, []);
        map.get(path).push(i);
      });
    });
    return map;
  }

  function tierFor(item, sameCategory){
    if(sameCategory.length < 2) return "gray";
    const sorted = sameCategory.slice().sort((a,b) => a.cp - b.cp);
    const idx = sorted.indexOf(item);
    const third = Math.ceil(sorted.length / 3);
    if(idx < third) return "green";
    if(idx < third * 2) return "amber";
    return "red";
  }

  // 該品項在所屬類別（主類別/子類別完整路徑）中的 CP 值名次（由低到高，數字越小越划算）。
  // 若有多個子類別，每個子類別各自回傳一筆名次資訊。
  function rankInfoFor(item, categoryMap){
    return itemCategoryPaths(item).map(cat => {
      const group = categoryMap.get(cat);
      if(!group || group.length < 2) return null;
      const sorted = group.slice().sort((a,b) => a.cp - b.cp);
      const idx = sorted.indexOf(item);
      if(idx === -1) return null;
      return { cat, rank: idx + 1, total: sorted.length };
    }).filter(Boolean);
  }

  function updateCategoryStatsBar(){
    if(activeCategory === "__all__"){
      categoryStatsBar.classList.remove("show");
      return;
    }
    const group = items.filter(i => !i.pending && categoryMatches(i, activeCategory));
    if(group.length === 0){
      categoryStatsBar.classList.remove("show");
      return;
    }
    const avg = group.reduce((sum, i) => sum + i.cp, 0) / group.length;
    const best = group.slice().sort((a,b) => a.cp - b.cp)[0];
    const { parent, child } = splitCategoryPath(activeCategory);
    const label = child ? `${escapeHtml(parent)} ▸ ${escapeHtml(child)}` : escapeHtml(parent);
    categoryStatsBar.innerHTML = `類別「<strong>${label}</strong>」平均 CP 值：<strong>${avg.toFixed(3)}</strong> $/g（共 ${group.length} 筆・最划算 ${best.cp.toFixed(3)}）`;
    categoryStatsBar.classList.add("show");
  }

  // 搜尋框比對邏輯：同時比對品項名稱、主類別、子類別，只要其中一個包含關鍵字就算符合，
  // 這樣不只能搜品項名稱，也能直接輸入類別或子類別名稱來篩選（例如輸入「甜的」會列出所有「甜的」子類別的品項）
  function itemMatchesSearch(item, term){
    if(!term) return true;
    if(item.name && item.name.toLowerCase().includes(term)) return true;
    if(item.category && item.category.toLowerCase().includes(term)) return true;
    return subCategoriesOf(item).some(c => c.toLowerCase().includes(term));
  }

  function renderTable(){
    updateCategoryStatsBar();

    let list = items.filter(i => {
      const matchCat = categoryMatches(i, activeCategory);
      const matchSearch = itemMatchesSearch(i, searchTerm);
      return matchCat && matchSearch;
    });

    if(list.length === 0){
      tableBody.innerHTML = '<div class="empty-state">還沒有符合條件的紀錄</div>';
      return;
    }

    const categoryMap = buildCategoryMap();

    // ---- 依品項名稱分組：同個產品即使 ml/g 數或數量不同，也整合在一起方便比較 ----
    const groupOrder = [];
    const groupsMap = new Map();
    list.forEach(item => {
      const key = item.name.trim().toLowerCase();
      if(!groupsMap.has(key)){
        groupsMap.set(key, []);
        groupOrder.push(key);
      }
      groupsMap.get(key).push(item);
    });

    const groups = groupOrder.map(key => {
      const arr = groupsMap.get(key).slice().sort((a,b) => a.cp - b.cp); // 組內固定依 CP 值由低到高，方便比價

      // 代表項目：直接取整組中 CP 值最划算的那一筆（不論入數）
      const rep = arr[0];
      const others = arr.filter(i => i !== rep);

      return { key, items: arr, rep, others, bestCp: arr[0].cp };
    });

    // 組與組之間依目前排序方向（依各組最划算的 CP 值）排序
    groups.sort((a,b) => sortAsc ? a.bestCp - b.bestCp : b.bestCp - a.bestCp);

    function renderRow(item, opts){
      const { isRep, multi, isBestOfGroup, sub } = opts;
      let tier;
      if(item.pending){
        tier = "gray";
      } else if(multi){
        const arr = groupsMap.get(item.name.trim().toLowerCase());
        const idx = arr.indexOf(item);
        if(idx === 0) tier = "green";
        else if(idx === arr.length - 1) tier = "red";
        else tier = "amber";
      } else {
        const cat = itemPrimaryCategoryPath(item);
        const sameCategory = cat ? (categoryMap.get(cat) || []) : [];
        tier = tierFor(item, sameCategory);
      }

      const rankInfos = !item.pending ? rankInfoFor(item, categoryMap) : [];
      const rankBadge = rankInfos.map(r => {
        const { parent, child } = splitCategoryPath(r.cat);
        const label = child ? `${escapeHtml(parent)}▸${escapeHtml(child)}` : escapeHtml(parent);
        return `<span class="rank-badge" title="在「${label}」類別中依 CP 值由低到高排名，數字越小越划算">${label} 第${r.rank}名／${r.total}</span>`;
      }).join("");
      const bestBadge = (isBestOfGroup && !item.pending) ? `<span class="best-badge">🏆 ${isRep ? "最划算代表" : "組內最划算"}</span>` : "";
      const convertedBadge = (isRep && multi && (item.count || 1) > 1)
        ? `<span class="best-badge" title="換算成單一件（1入）在同樣克數/毫升下的價格">・換算1入：$${formatNum(item.unitPrice)}／${formatNum(item.grams)}g</span>`
        : "";
      const rowClass = "receipt-row" + (item.pending ? " pending" : "") + (multi ? " grouped" : "") + (sub ? " sub-row" : "");
      const dateBadge = item.date ? `<span class="date-badge">${escapeHtml(item.date)}</span>` : "";
      const locationBadge = item.location ? `<span class="date-badge">${escapeHtml(item.location)}</span>` : "";
      const itemSubs = subCategoriesOf(item);
      const catBadges = item.category
        ? `<span class="cat-badge">${escapeHtml(item.category)}${itemSubs.length ? ` ▸ ${itemSubs.map(escapeHtml).join("、")}` : ""}</span>`
        : "";
      const actions = item.pending
        ? (item.uploadError
            ? `<button class="del" data-row="${item.tempId}" title="上傳失敗，點擊移除">⚠</button>`
            : `<span class="pending-label" title="背景上傳中">⏳</span>`)
        : `<div class="row-actions">
             <button class="edit" data-row="${item.row}" title="編輯">✎</button>
             <button class="del" data-row="${item.row}" title="刪除">✕</button>
           </div>`;
      return `
        <div class="${rowClass}">
          <div class="name name-clickable" data-row="${item.row}" title="點擊進行快速比價">
            ${escapeHtml(item.name)} ${bestBadge}${convertedBadge}${rankBadge}
            <span class="cat-badge-group">${catBadges}</span>
            ${dateBadge}
            ${locationBadge}
          </div>
          <div class="stats">
            <div class="stat grams-col mono"><span class="stat-label">克數</span><span class="stat-val">${formatNum(item.grams)}g</span></div>
            <div class="stat price-col mono"><span class="stat-label">總價</span><span class="stat-val">$${formatNum(item.price)}</span></div>
            <div class="stat count-col mono"><span class="stat-label">數量</span><span class="stat-val">${item.count}入</span></div>
            <div class="stat mono"><span class="stat-label">單罐價</span><span class="stat-val">$${formatNum(item.unitPrice)}</span></div>
          </div>
          <div class="cp-cell">
            <span class="stat-label mono">$/g</span>
            <span class="dot ${tier}"></span>
            <span class="cp-val mono">${item.cp.toFixed(3)}</span>
          </div>
          ${actions}
        </div>
      `;
    }

    tableBody.innerHTML = groups.map(group => {
      const { key, items: arr, rep, others } = group;
      const multi = arr.length > 1;
      const groupHeader = multi
        ? `<div class="group-header">📦 ${escapeHtml(arr[0].name)} · 共 ${arr.length} 種容量／數量／通路，預設顯示整組最划算的紀錄（多入會換算成1入價格）</div>`
        : "";

      const repRow = renderRow(rep, { isRep: true, multi, isBestOfGroup: true, sub: false });

      let othersHtml = "";
      if(others.length){
        const expanded = expandedGroups.has(key);
        const toggleLabel = expanded
          ? `▴ 收合其他 ${others.length} 種容量／數量`
          : `▾ 查看其他 ${others.length} 種容量／數量／通路`;
        const subRows = others.map(item => renderRow(item, { isRep: false, multi, isBestOfGroup: false, sub: true })).join("");
        othersHtml = `
          <button type="button" class="sub-toggle" data-group="${escapeHtml(key)}">${toggleLabel}</button>
          <div class="sub-items" style="display:${expanded ? "block" : "none"};">${subRows}</div>
        `;
      }

      return `<div class="group-block">${groupHeader}${repRow}${othersHtml}</div>`;
    }).join("");

    tableBody.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", () => deleteItem(btn.dataset.row));
    });
    tableBody.querySelectorAll(".edit").forEach(btn => {
      btn.addEventListener("click", () => {
        const item = items.find(i => String(i.row) === btn.dataset.row);
        if(item) startEdit(item);
      });
    });
    tableBody.querySelectorAll(".name-clickable").forEach(el => {
      el.addEventListener("click", () => {
        const item = items.find(i => String(i.row) === el.dataset.row);
        if(item) openCompareModal(item);
      });
    });
    tableBody.querySelectorAll(".sub-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.group;
        if(expandedGroups.has(key)) expandedGroups.delete(key);
        else expandedGroups.add(key);
        renderTable();
      });
    });
  }

  function formatNum(n){
    if(Number.isInteger(n)) return n.toString();
    return n.toFixed(2).replace(/\.?0+$/, "");
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  // ---------- 啟動 ----------
  renderLocationOptions();

  const cached = localStorage.getItem(LS_CACHE_KEY);
  if(cached){
    try{
      items = JSON.parse(cached).map(migrateItem);
      renderLocationOptions();
      renderCategoryChips();
      renderTable();
    }catch(e){}
  }
  loadItems();

})();
</script>

</body>
