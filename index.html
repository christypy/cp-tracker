<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CP值紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EF;
    --paper-2:#F1ECDE;
    --line:#DCD3B8;
    --ink:#2B2820;
    --ink-soft:#7A7263;
    --red:#B7472A;
    --green:#3F6B4F;
    --amber:#B6862C;
    --gold:#C9A227;
    --white:#FFFDF8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(var(--line) 0.6px, transparent 0.6px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:'Space Mono', monospace;}

  /* ---------- header ---------- */
  header{
    max-width:880px;
    margin:0 auto;
    padding:36px 20px 18px;
    text-align:center;
  }
  header .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  header h1{
    font-size:clamp(28px, 6vw, 40px);
    margin:6px 0 4px;
    font-weight:900;
    letter-spacing:-.01em;
  }
  header p{
    color:var(--ink-soft);
    font-size:14px;
    margin:0;
  }

  main{
    max-width:880px;
    margin:0 auto;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* ---------- card base: price-tag paper ---------- */
  .tag-card{
    background:var(--white);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line), 0 8px 24px -18px rgba(43,40,32,.4);
    padding:22px 20px 24px;
    position:relative;
  }
  .tag-card::before{
    /* punch hole */
    content:"";
    position:absolute;
    top:-9px;
    left:50%;
    transform:translateX(-50%);
    width:18px;
    height:18px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:50%;
    box-shadow:0 0 0 4px var(--white);
  }
  .card-title{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-family:'Space Mono', monospace;
    margin:0 0 14px;
    text-align:center;
  }

  /* ---------- quick calculator ---------- */
  .calc-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
    align-items:end;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .field input, .field select{
    font-family:'Space Mono', monospace;
    font-size:17px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
    width:100%;
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  .calc-result{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:6px;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .stamp{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:24px;
    padding:10px 18px;
    border:3px solid var(--ink-soft);
    border-radius:10px;
    color:var(--ink-soft);
    transform:rotate(-3deg);
    transition:transform .15s ease, color .15s ease, border-color .15s ease;
    white-space:nowrap;
    text-align:center;
  }
  .stamp.show{transform:rotate(-3deg) scale(1);}
  .stamp small{
    display:block;
    font-size:10px;
    letter-spacing:.1em;
    font-weight:400;
    text-align:center;
    margin-top:2px;
  }
  .stamp .unit-p{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
    margin-top:4px;
  }

  /* ---------- add item form ---------- */
  form#addForm{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
  }
  form#addForm .field.full{grid-column:1/-1;}
  #addBtn{
    grid-column:1/-1;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:.04em;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:opacity .15s ease;
  }
  #addBtn:active{opacity:.7;}
  #addBtn:disabled{opacity:.5;cursor:not-allowed;}
  #cancelEditBtn{
    grid-column:1/-1;
    font-family:'Space Mono', monospace;
    font-size:13px;
    padding:9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    margin-top:-4px;
  }
  #formMsg{
    grid-column:1/-1;
    font-size:13px;
    text-align:center;
    min-height:16px;
    color:var(--ink-soft);
  }

  /* ---------- controls row ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  #searchInput{
    font-family:'Noto Sans TC', sans-serif;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--white);
    min-width:150px;
    flex:1;
    max-width:220px;
  }
  #syncStatus{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  #refreshBtn{
    background:none;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 10px;
    cursor:pointer;
    font-size:14px;
    color:var(--ink-soft);
  }

  /* ---------- receipt table ---------- */
  .receipt{
    background:var(--white);
    border-radius:var(--radius);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .receipt-row{
    display:grid;
    grid-template-columns:1.8fr .8fr .8fr .6fr .8fr .9fr .8fr;
    gap:6px;
    align-items:center;
    padding:12px 14px;
    border-bottom:1px dashed var(--line);
  }
  .receipt-row:last-child{border-bottom:none;}
  .receipt-row.head{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
  }
  .receipt-row .name{
    font-weight:500;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .receipt-row .name-clickable{
    cursor:pointer;
    padding:4px;
    margin:-4px;
    border-radius:6px;
    transition:background-color .15s ease;
  }
  .receipt-row .name-clickable:hover{
    background-color:var(--paper-2);
  }
  .receipt-row .name-clickable::after{
    content:" 🔍 比價";
    font-size:10px;
    color:var(--gold);
    opacity:0;
    transition:opacity .15s ease;
  }
  .receipt-row .name-clickable:hover::after{
    opacity:1;
  }
  .receipt-row .name .cat-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    width:fit-content;
  }
  .receipt-row .name .date-badge{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    width:fit-content;
  }
  .receipt-row.pending{
    opacity:.55;
  }
  .receipt-row .pending-label{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--gold);
  }
  .receipt-row .num{
    font-family:'Space Mono', monospace;
    text-align:right;
    font-size:13px;
  }
  /* stats group: on desktop its children become normal grid cells (display:contents),
     on mobile it becomes a wrapping row of labeled chips */
  .receipt-row .stats{
    display:contents;
  }
  .receipt-row .stat{
    font-family:'Space Mono', monospace;
    text-align:right;
    font-size:13px;
  }
  .receipt-row .stat-label{
    display:none;
  }
  .receipt-row .stat-val{
    font-weight:400;
  }
  .receipt-row .cp-cell{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
  }
  .receipt-row .cp-cell .stat-label{
    margin-right:auto;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    flex-shrink:0;
  }
  .dot.green{background:var(--green);}
  .dot.amber{background:var(--amber);}
  .dot.red{background:var(--red);}
  .dot.gray{background:var(--ink-soft);}
  .receipt-row .cp-val{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:14px;
  }
  .receipt-row .del{
    background:none;
    border:none;
    color:var(--line);
    cursor:pointer;
    font-size:14px;
    padding:2px 4px;
  }
  .receipt-row .del:hover{color:var(--red);}
  .receipt-row .row-actions{
    display:flex;
    gap:2px;
    justify-content:flex-end;
  }
  .receipt-row .edit{
    background:none;
    border:none;
    color:var(--line);
    cursor:pointer;
    font-size:14px;
    padding:2px 4px;
  }
  .receipt-row .edit:hover{color:var(--ink);}
  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* ---------- settings ---------- */
  details#settings{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 18px;
  }
  details#settings summary{
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.06em;
  }
  .settings-body{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .settings-body input{
    font-family:'Space Mono', monospace;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    width:100%;
  }
  .settings-body button{
    align-self:flex-start;
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:8px 14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    cursor:pointer;
  }
  .settings-body p{
    font-size:12px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.6;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Space Mono', monospace;
    margin-top:30px;
  }

  /* ---------- mobile ---------- */
  @media (max-width:560px){
    .receipt-row.head{display:none;} /* labels now shown inline per row instead */

    .receipt-row{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px 10px;
      font-size:12px;
      padding:14px;
    }
    .receipt-row .name{
      flex:0 0 100%;
    }
    .receipt-row .stats{
      display:flex;
      flex-wrap:wrap;
      flex:0 0 100%;
      gap:6px 16px;
    }
    .receipt-row .stat{
      display:flex;
      align-items:baseline;
      gap:4px;
      text-align:left;
    }
    .receipt-row .stat-label{
      display:inline;
      font-size:10px;
      letter-spacing:.04em;
      color:var(--ink-soft);
    }
    .receipt-row .stat-val{
      font-weight:700;
      font-size:13px;
    }
    .receipt-row .cp-cell{
      flex:1 1 auto;
      justify-content:flex-start;
      gap:8px;
      padding-top:8px;
      border-top:1px dashed var(--line);
    }
    .receipt-row .cp-cell .stat-label{
      display:inline;
      margin-right:0;
    }
    .receipt-row .cp-val{
      font-size:15px;
    }
    .receipt-row .row-actions,
    .receipt-row .pending-label,
    .receipt-row > .del{
      flex:0 0 auto;
      margin-left:auto;
      padding-top:8px;
      border-top:1px dashed var(--line);
    }

    form#addForm{grid-template-columns:1fr 1fr 1fr;}
    .calc-grid{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">$ / g Ledger</div>
  <h1>CP值帳本</h1>
  <p>輸入克數跟價格，馬上算出 CP 值與單罐價格 · 資料同步 Google 試算表</p>
</header>

<main>

  <!-- 新增品項（先算再填資料） -->
  <section class="tag-card">
    <p class="card-title" id="formTitle">新增品項</p>
    <form id="addForm">
      <div class="field">
        <label for="itemGrams">單罐克數 (g)</label>
        <input type="number" id="itemGrams" inputmode="decimal" step="any" placeholder="例如 50" required>
      </div>
      <div class="field">
        <label for="itemPrice">總價格 ($)</label>
        <input type="number" id="itemPrice" inputmode="decimal" placeholder="例如 380" required>
      </div>
      <div class="field">
        <label for="itemCount">數量 (入/罐)</label>
        <input type="number" id="itemCount" inputmode="numeric" value="1" min="1" placeholder="例如 1" required>
      </div>

      <div class="calc-result">
        <div class="stamp mono" id="calcStamp">
          --<small>$ / g</small>
          <div class="unit-p" id="unitPricePreview">單罐 --</div>
        </div>
      </div>

      <div class="field full">
        <label for="itemName">品項名稱</label>
        <input type="text" id="itemName" placeholder="例如 DHC 金靚白水亮防曬乳" required>
      </div>
      <div class="field full">
        <label for="itemCategory">類別</label>
        <input type="text" id="itemCategory" list="categoryList" placeholder="例如 防曬" required>
        <datalist id="categoryList"></datalist>
      </div>
      <div class="field full">
        <label for="itemDate">日期</label>
        <input type="date" id="itemDate">
      </div>
      <div class="field full">
        <label for="itemLocation">購買地點</label>
        <select id="itemLocation">
          <option value="">-- 選擇購買地點 --</option>
          <option value="全聯線上">全聯線上</option>
          <option value="全聯">全聯</option>
          <option value="家樂福線上">家樂福線上</option>
          <option value="PChome">PChome</option>
          <option value="MoMo">MoMo</option>
          <option value="蝦皮">蝦皮</option>
          <option value="LG生活">LG生活</option>
          <option value="花王特賣">花王特賣</option>
          <option value="康是美">康是美</option>
          <option value="寶雅">寶雅</option>
          <option value="寶雅線上">寶雅線上</option>
          <option value="屈臣氏">屈臣氏</option>
          <option value="自行輸入">自行輸入…</option>
        </select>
        <input type="text" id="itemLocationCustom" placeholder="輸入購買地點" style="display:none; margin-top:6px;">
      </div>

      <button type="submit" id="addBtn">加入紀錄</button>
      <button type="button" id="cancelEditBtn" style="display:none;">取消編輯</button>
      <div id="formMsg"></div>
    </form>
  </section>

  <!-- 篩選 / 搜尋 -->
  <section class="controls">
    <div class="chips" id="categoryChips">
      <button class="chip active" data-cat="__all__">全部</button>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="sortToggleBtn" class="chip" title="切換排序方向">CP值 低→高 ↑</button>
      <input type="text" id="searchInput" placeholder="搜尋品項…">
    </div>
  </section>

  <div id="syncStatus">
    <span id="syncText">尚未同步</span>
    <button id="refreshBtn" title="重新整理">↻</button>
  </div>

  <!-- 表格 -->
  <section class="receipt">
    <div class="receipt-row head">
      <div>品項 / 類別 (點擊名稱可比價)</div>
      <div class="stats">
        <div class="stat grams-col">克數</div>
        <div class="stat price-col">總價</div>
        <div class="stat count-col">數量</div>
        <div class="stat">單罐價</div>
      </div>
      <div class="num">$ / g</div>
      <div></div>
    </div>
    <div id="tableBody">
      <div class="empty-state">載入中…</div>
    </div>
  </section>

  <!-- 設定 -->
  <details id="settings">
    <summary>⚙ 設定同步網址</summary>
    <div class="settings-body">
      <p>把你部署好的 Google Apps Script 網頁應用程式網址貼在這裡。網址會存在這台裝置的瀏覽器裡，不會上傳到任何地方。</p>
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/xxxx/exec">
      <button id="saveUrlBtn">儲存網址</button>
    </div>
  </details>

</main>

<!-- 比價彈窗 Modal -->
<div id="compareModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
  <div class="tag-card" style="width:90%; max-width:400px; margin:0; background:var(--white);">
    <p class="card-title">快速比價計算</p>
    <div style="font-size:15px; margin-bottom:6px; font-weight:700; text-align:center;" id="modalItemName">-</div>
    <div style="font-size:12px; color:var(--ink-soft); margin-bottom:16px; text-align:center;">
      基準 CP 值：<span id="modalBaseCp" class="mono" style="font-weight:700; color:var(--ink);">-</span> $ / g(ml)
    </div>
    
    <div class="calc-grid" style="grid-template-columns:1fr 1fr;">
      <div class="field">
        <label for="modalGrams">新容量 (ml/g)</label>
        <input type="number" id="modalGrams" inputmode="decimal" placeholder="例如 100">
      </div>
      <div class="field">
        <label for="modalPrice">現場售價 ($)</label>
        <input type="number" id="modalPrice" inputmode="decimal" placeholder="例如 150">
      </div>
    </div>

    <div class="calc-result" style="flex-direction:column; gap:8px;">
      <div style="font-size:13px; color:var(--ink-soft);">
        等比例目標價：<strong id="modalTargetPrice" class="mono" style="font-size:20px; color:var(--ink);">$ --</strong>
      </div>
      <div id="modalVerdict" class="stamp mono" style="font-size:15px; padding:6px 12px; transform:none; display:none; margin-top:4px;">--</div>
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button type="button" id="closeModalBtn" style="flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); cursor:pointer; font-family:'Space Mono', monospace; font-size:13px;">關閉</button>
    </div>
  </div>
</div>

<footer>手動記帳，理性剁手 · made for 劃算度控</footer>

<script>
(function(){
  "use strict";

  const LS_URL_KEY = "cp_tracker_script_url";
  const LS_CACHE_KEY = "cp_tracker_cache";
  const LS_LOCATIONS_KEY = "cp_tracker_custom_locations";

  // 預設同步網址
  const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4SLRn8eRvg9pP4rrptYfbgIt3W5en2vrrfyUJG2SxpenrZp4D07wuRKiZDbIoMDq7/exec";

  // 預設預設選單地點
  const DEFAULT_LOCATIONS = [
    "全聯線上", "全聯", "家樂福線上", "PChome", "MoMo", "蝦皮", 
    "LG生活", "花王特賣", "康是美", "寶雅", "寶雅線上", "屈臣氏"
  ];

  let scriptUrl = localStorage.getItem(LS_URL_KEY) || DEFAULT_SCRIPT_URL;
  let customLocations = JSON.parse(localStorage.getItem(LS_LOCATIONS_KEY) || "[]");
  let items = [];
  let activeCategory = "__all__";
  let searchTerm = "";
  let sortAsc = true;

  const $ = (id) => document.getElementById(id);
  const scriptUrlInput = $("scriptUrl");
  const tableBody = $("tableBody");
  const syncText = $("syncText");
  const categoryChips = $("categoryChips");
  const categoryList = $("categoryList");
  const formMsg = $("formMsg");
  const addBtn = $("addBtn");

  scriptUrlInput.value = scriptUrl;

  // ---------- 新增表單內的即時試算 ----------
  const itemGramsInput = $("itemGrams");
  const itemPriceInput = $("itemPrice");
  const itemCountInput = $("itemCount");
  const calcStamp = $("calcStamp");

  function updateCalc(){
    const g = parseFloat(itemGramsInput.value);
    const p = parseFloat(itemPriceInput.value);
    const count = parseInt(itemCountInput.value, 10) || 1;

    if(g > 0 && p >= 0 && count > 0 && !isNaN(g) && !isNaN(p)){
      const unitPrice = p / count;
      const cp = p / (g * count);
      calcStamp.innerHTML = cp.toFixed(3) + "<small>$ / g</small>" +
                            "<div class='unit-p'>單罐 $" + formatNum(unitPrice) + "</div>";
      calcStamp.style.color = "var(--ink)";
      calcStamp.style.borderColor = "var(--ink)";
    } else {
      calcStamp.innerHTML = "--<small>$ / g</small><div class='unit-p'>單罐 --</div>";
      calcStamp.style.color = "var(--ink-soft)";
      calcStamp.style.borderColor = "var(--ink-soft)";
    }
  }
  itemGramsInput.addEventListener("input", updateCalc);
  itemPriceInput.addEventListener("input", updateCalc);
  itemCountInput.addEventListener("input", updateCalc);

  // ---------- 購買地點（記憶與動態渲染） ----------
  const itemLocationSelect = $("itemLocation");
  const itemLocationCustom = $("itemLocationCustom");

  function renderLocationOptions(){
    // 收集所有出現過的地點（包含預設、使用者新增、歷史紀錄）
    const historyLocations = items.map(i => i.location).filter(Boolean);
    const allLocations = Array.from(new Set([...DEFAULT_LOCATIONS, ...customLocations, ...historyLocations]));

    const currentVal = getLocationValue();

    // 清空並重新建立選單
    itemLocationSelect.innerHTML = '<option value="">-- 選擇購買地點 --</option>';
    allLocations.forEach(loc => {
      const opt = document.createElement("option");
      opt.value = loc;
      opt.textContent = loc;
      itemLocationSelect.appendChild(opt);
    });

    const customOpt = document.createElement("option");
    customOpt.value = "自行輸入";
    customOpt.textContent = "自行輸入…";
    itemLocationSelect.appendChild(customOpt);

    setLocationValue(currentVal);
  }

  function saveCustomLocation(loc){
    if(!loc) return;
    if(!DEFAULT_LOCATIONS.includes(loc) && !customLocations.includes(loc)){
      customLocations.push(loc);
      localStorage.setItem(LS_LOCATIONS_KEY, JSON.stringify(customLocations));
    }
  }

  itemLocationSelect.addEventListener("change", () => {
    if(itemLocationSelect.value === "自行輸入"){
      itemLocationCustom.style.display = "block";
      itemLocationCustom.focus();
    } else {
      itemLocationCustom.style.display = "none";
      itemLocationCustom.value = "";
    }
  });

  function getLocationValue(){
    if(itemLocationSelect.value === "自行輸入"){
      return itemLocationCustom.value.trim();
    }
    return itemLocationSelect.value;
  }

  function setLocationValue(loc){
    if(!loc){
      itemLocationSelect.value = "";
      itemLocationCustom.value = "";
      itemLocationCustom.style.display = "none";
      return;
    }
    const preset = Array.from(itemLocationSelect.options).some(o => o.value === loc && o.value !== "自行輸入");
    if(preset){
      itemLocationSelect.value = loc;
      itemLocationCustom.value = "";
      itemLocationCustom.style.display = "none";
    } else {
      itemLocationSelect.value = "自行輸入";
      itemLocationCustom.value = loc;
      itemLocationCustom.style.display = "block";
    }
  }

  // ---------- 快速比價 Modal 邏輯 ----------
  const compareModal = $("compareModal");
  const modalItemName = $("modalItemName");
  const modalBaseCp = $("modalBaseCp");
  const modalGrams = $("modalGrams");
  const modalPrice = $("modalPrice");
  const modalTargetPrice = $("modalTargetPrice");
  const modalVerdict = $("modalVerdict");
  const closeModalBtn = $("closeModalBtn");

  let activeCompareCp = 0;

  function openCompareModal(item){
    activeCompareCp = item.cp;
    modalItemName.textContent = item.name;
    modalBaseCp.textContent = item.cp.toFixed(3);
    modalGrams.value = "";
    modalPrice.value = "";
    modalTargetPrice.textContent = "$ --";
    modalVerdict.style.display = "none";
    compareModal.style.display = "flex";
    modalGrams.focus();
  }

  function calcComparison(){
    const newGrams = parseFloat(modalGrams.value);
    const newPrice = parseFloat(modalPrice.value);

    if(newGrams > 0 && !isNaN(newGrams)){
      const targetPrice = activeCompareCp * newGrams;
      modalTargetPrice.textContent = "$" + targetPrice.toFixed(1);

      if(!isNaN(newPrice) && newPrice >= 0){
        modalVerdict.style.display = "block";
        const diff = Math.abs(newPrice - targetPrice).toFixed(1);
        if(newPrice < targetPrice){
          modalVerdict.textContent = "🎉 更划算！(省 $" + diff + ")";
          modalVerdict.style.color = "var(--green)";
          modalVerdict.style.borderColor = "var(--green)";
        } else if(newPrice > targetPrice){
          modalVerdict.textContent = "❌ 買貴了！(貴 $" + diff + ")";
          modalVerdict.style.color = "var(--red)";
          modalVerdict.style.borderColor = "var(--red)";
        } else {
          modalVerdict.textContent = "⚖ 劃算度相同";
          modalVerdict.style.color = "var(--ink-soft)";
          modalVerdict.style.borderColor = "var(--ink-soft)";
        }
      } else {
        modalVerdict.style.display = "none";
      }
    } else {
      modalTargetPrice.textContent = "$ --";
      modalVerdict.style.display = "none";
    }
  }

  modalGrams.addEventListener("input", calcComparison);
  modalPrice.addEventListener("input", calcComparison);

  closeModalBtn.addEventListener("click", () => {
    compareModal.style.display = "none";
  });

  compareModal.addEventListener("click", (e) => {
    if(e.target === compareModal) compareModal.style.display = "none";
  });

  // ---------- 設定 ----------
  $("saveUrlBtn").addEventListener("click", () => {
    scriptUrl = scriptUrlInput.value.trim();
    localStorage.setItem(LS_URL_KEY, scriptUrl);
    formMsg.textContent = "";
    loadItems();
  });

  $("refreshBtn").addEventListener("click", loadItems);

  // ---------- 讀取資料 ----------
  async function loadItems(){
    if(!scriptUrl){
      tableBody.innerHTML = '<div class="empty-state">請先在下方「設定」貼上你的 Google Apps Script 網址</div>';
      syncText.textContent = "尚未設定同步網址";
      return;
    }
    syncText.textContent = "同步中…";
    try{
      const res = await fetch(scriptUrl + "?t=" + Date.now());
      const data = await res.json();
      if(data.status !== "ok") throw new Error(data.message || "讀取失敗");
      const serverItems = (data.items || []).map(normalizeItem);
      const stillPending = items.filter(i => i.pending && uploadQueue.some(j => j.tempId === i.tempId));
      items = [...stillPending, ...serverItems];
      localStorage.setItem(LS_CACHE_KEY, JSON.stringify(serverItems));
      syncText.textContent = "已同步 · " + new Date().toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"});
      renderLocationOptions();
      renderCategoryChips();
      renderTable();
    }catch(err){
      const cached = localStorage.getItem(LS_CACHE_KEY);
      if(cached){
        items = JSON.parse(cached);
        renderLocationOptions();
        renderCategoryChips();
        renderTable();
      }
      syncText.textContent = "同步失敗，顯示上次快取（" + err.message + "）";
    }
  }

  function normalizeItem(raw){
    const grams = Number(raw["克數"]);
    const price = Number(raw["價格"]);
    const count = Number(raw["數量"]) || 1;
    const unitPrice = raw["單罐價格"] !== undefined && raw["單罐價格"] !== "" ? Number(raw["單罐價格"]) : (count > 0 ? price / count : price);
    const cp = (grams * count) > 0 ? price / (grams * count) : 0;
    return {
      row: raw["_row"],
      name: raw["品項名稱"] || "",
      category: raw["類別"] || "未分類",
      grams: grams,
      price: price,
      count: count,
      unitPrice: unitPrice,
      cp: cp,
      date: raw["日期"] || "",
      location: raw["地點"] || "",
      pending: false
    };
  }

  // ---------- 新增品項（背景佇列上傳） ----------
  const itemDateInput = $("itemDate");
  itemDateInput.value = new Date().toISOString().slice(0, 10);

  const uploadQueue = [];
  let isProcessingQueue = false;
  let tempIdCounter = 0;

  function updateQueueStatus(){
    const n = uploadQueue.length + (isProcessingQueue ? 1 : 0);
    if(n > 0){
      syncText.textContent = "背景上傳中…（剩餘 " + n + " 筆）";
    }
  }

  async function processQueue(){
    if(isProcessingQueue) return;
    isProcessingQueue = true;
    while(uploadQueue.length > 0){
      const job = uploadQueue[0];
      updateQueueStatus();
      try{
        await fetch(scriptUrl, {
          method: "POST",
          headers: {"Content-Type": "text/plain;charset=utf-8"},
          body: JSON.stringify({
            action: "add",
            name: job.name,
            category: job.category,
            grams: job.grams,
            price: job.price,
            count: job.count,
            unitPrice: job.unitPrice,
            date: job.date,
            location: job.location
          })
        });
        job.failed = false;
      }catch(err){
        job.failed = true;
        const stillPending = items.find(i => i.tempId === job.tempId);
        if(stillPending){
          stillPending.uploadError = true;
        }
        renderTable();
      }
      uploadQueue.shift();
    }
    isProcessingQueue = false;
    await loadItems();
  }

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if(!scriptUrl){
      formMsg.textContent = "請先設定同步網址";
      return;
    }
    const name = $("itemName").value.trim();
    const category = $("itemCategory").value.trim();
    const grams = parseFloat($("itemGrams").value);
    const price = parseFloat($("itemPrice").value);
    const count = parseInt($("itemCount").value, 10) || 1;
    const date = itemDateInput.value || "";
    const location = getLocationValue();
    if(!name || !category || !(grams > 0) || isNaN(price) || price < 0 || count < 1){
      formMsg.textContent = "請確認欄位都已正確填寫";
      return;
    }
    if(itemLocationSelect.value === "自行輸入" && !location){
      formMsg.textContent = "請輸入購買地點，或改選其他選項";
      return;
    }

    // 儲存新輸入的地點並刷新下拉選單
    saveCustomLocation(location);

    const unitPrice = price / count;
    const cp = price / (grams * count);

    if(editingRow !== null){
      submitUpdate(editingRow, { name, category, grams, price, count, unitPrice, date, location });
      return;
    }

    tempIdCounter += 1;
    const tempId = "pending-" + tempIdCounter;

    items.unshift({
      row: tempId,
      tempId: tempId,
      name, category, grams, price, count, unitPrice, cp, date, location,
      pending: true,
      uploadError: false
    });

    renderLocationOptions();
    renderCategoryChips();
    renderTable();

    $("addForm").reset();
    $("itemCount").value = "1";
    itemDateInput.value = date || new Date().toISOString().slice(0, 10);
    setLocationValue("");
    formMsg.textContent = "";
    $("itemGrams").focus();

    uploadQueue.push({ tempId, name, category, grams, price, count, unitPrice, date, location });
    processQueue();
  });

  // ---------- 編輯品項 ----------
  const formTitle = $("formTitle");
  const cancelEditBtn = $("cancelEditBtn");
  let editingRow = null;

  function startEdit(item){
    editingRow = item.row;
    $("itemGrams").value = item.grams;
    $("itemPrice").value = item.price;
    $("itemCount").value = item.count || 1;
    $("itemName").value = item.name;
    $("itemCategory").value = item.category;
    itemDateInput.value = item.date || new Date().toISOString().slice(0, 10);
    setLocationValue(item.location || "");
    updateCalc();
    formTitle.textContent = "編輯品項";
    addBtn.textContent = "更新紀錄";
    cancelEditBtn.style.display = "block";
    formMsg.textContent = "";
    $("itemGrams").scrollIntoView({ behavior: "smooth", block: "center" });
    $("itemGrams").focus();
  }

  function endEdit(){
    editingRow = null;
    $("addForm").reset();
    $("itemCount").value = "1";
    itemDateInput.value = new Date().toISOString().slice(0, 10);
    setLocationValue("");
    updateCalc();
    formTitle.textContent = "新增品項";
    addBtn.textContent = "加入紀錄";
    cancelEditBtn.style.display = "none";
  }

  cancelEditBtn.addEventListener("click", endEdit);

  function submitUpdate(row, fields){
    const target = items.find(i => i.row === row);
    if(target){
      target.name = fields.name;
      target.category = fields.category;
      target.grams = fields.grams;
      target.price = fields.price;
      target.count = fields.count;
      target.unitPrice = fields.unitPrice;
      target.cp = fields.price / (fields.grams * fields.count);
      target.date = fields.date;
      target.location = fields.location;
      target.updating = true;
    }
    renderLocationOptions();
    renderCategoryChips();
    renderTable();
    endEdit();
    formMsg.textContent = "";
    syncText.textContent = "背景更新中…";

    fetch(scriptUrl, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({ action: "update", row, ...fields })
    }).then(() => {
      loadItems();
    }).catch((err) => {
      syncText.textContent = "更新失敗：" + err.message;
    });
  }

  // ---------- 刪除品項 ----------
  async function deleteItem(row){
    if(String(row).startsWith("pending-")){
      items = items.filter(i => i.row !== row);
      renderTable();
      return;
    }
    if(!scriptUrl) return;
    if(!confirm("確定要刪除這筆紀錄嗎？")) return;
    try{
      await fetch(scriptUrl, {
        method: "POST",
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({ action: "delete", row })
      });
      await loadItems();
    }catch(err){
      alert("刪除失敗：" + err.message);
    }
  }

  // ---------- 類別篩選 ----------
  function renderCategoryChips(){
    const cats = Array.from(new Set(items.map(i => i.category))).sort();
    categoryList.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join("");
    categoryChips.innerHTML = "";
    const allChip = document.createElement("button");
    allChip.className = "chip" + (activeCategory === "__all__" ? " active" : "");
    allChip.textContent = "全部";
    allChip.dataset.cat = "__all__";
    allChip.addEventListener("click", () => { activeCategory = "__all__"; renderCategoryChips(); renderTable(); });
    categoryChips.appendChild(allChip);
    cats.forEach(c => {
      const chip = document.createElement("button");
      chip.className = "chip" + (activeCategory === c ? " active" : "");
      chip.textContent = c;
      chip.dataset.cat = c;
      chip.addEventListener("click", () => { activeCategory = c; renderCategoryChips(); renderTable(); });
      categoryChips.appendChild(chip);
    });
  }

  $("searchInput").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderTable();
  });

  const sortToggleBtn = $("sortToggleBtn");
  sortToggleBtn.addEventListener("click", () => {
    sortAsc = !sortAsc;
    sortToggleBtn.textContent = sortAsc ? "CP值 低→高 ↑" : "CP值 高→低 ↓";
    renderTable();
  });

  // ---------- 表格渲染 ----------
  function tierFor(item, sameCategory){
    if(sameCategory.length < 2) return "gray";
    const sorted = sameCategory.slice().sort((a,b) => a.cp - b.cp);
    const idx = sorted.indexOf(item);
    const third = Math.ceil(sorted.length / 3);
    if(idx < third) return "green";
    if(idx < third * 2) return "amber";
    return "red";
  }

  function renderTable(){
    let list = items.filter(i => {
      const matchCat = activeCategory === "__all__" || i.category === activeCategory;
      const matchSearch = !searchTerm || i.name.toLowerCase().includes(searchTerm);
      return matchCat && matchSearch;
    });
    list = list.slice().sort((a,b) => sortAsc ? a.cp - b.cp : b.cp - a.cp);

    if(list.length === 0){
      tableBody.innerHTML = '<div class="empty-state">還沒有符合條件的紀錄</div>';
      return;
    }

    tableBody.innerHTML = list.map(item => {
      const sameCategory = items.filter(i => i.category === item.category && !i.pending);
      const tier = item.pending ? "gray" : tierFor(item, sameCategory);
      const rowClass = "receipt-row" + (item.pending ? " pending" : "");
      const dateBadge = item.date ? `<span class="date-badge">${escapeHtml(item.date)}</span>` : "";
      const locationBadge = item.location ? `<span class="date-badge">${escapeHtml(item.location)}</span>` : "";
      const actions = item.pending
        ? (item.uploadError
            ? `<button class="del" data-row="${item.tempId}" title="上傳失敗，點擊移除">⚠</button>`
            : `<span class="pending-label" title="背景上傳中">⏳</span>`)
        : `<div class="row-actions">
             <button class="edit" data-row="${item.row}" title="編輯">✎</button>
             <button class="del" data-row="${item.row}" title="刪除">✕</button>
           </div>`;
      return `
        <div class="${rowClass}">
          <div class="name name-clickable" data-row="${item.row}" title="點擊進行快速比價">
            ${escapeHtml(item.name)}
            <span class="cat-badge">${escapeHtml(item.category)}</span>
            ${dateBadge}
            ${locationBadge}
          </div>
          <div class="stats">
            <div class="stat grams-col mono"><span class="stat-label">克數</span><span class="stat-val">${formatNum(item.grams)}g</span></div>
            <div class="stat price-col mono"><span class="stat-label">總價</span><span class="stat-val">$${formatNum(item.price)}</span></div>
            <div class="stat count-col mono"><span class="stat-label">數量</span><span class="stat-val">${item.count}入</span></div>
            <div class="stat mono"><span class="stat-label">單罐價</span><span class="stat-val">$${formatNum(item.unitPrice)}</span></div>
          </div>
          <div class="cp-cell">
            <span class="stat-label mono">$/g</span>
            <span class="dot ${tier}"></span>
            <span class="cp-val mono">${item.cp.toFixed(3)}</span>
          </div>
          ${actions}
        </div>
      `;
    }).join("");

    tableBody.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", () => deleteItem(btn.dataset.row));
    });
    tableBody.querySelectorAll(".edit").forEach(btn => {
      btn.addEventListener("click", () => {
        const item = items.find(i => String(i.row) === btn.dataset.row);
        if(item) startEdit(item);
      });
    });
    tableBody.querySelectorAll(".name-clickable").forEach(el => {
      el.addEventListener("click", () => {
        const item = items.find(i => String(i.row) === el.dataset.row);
        if(item) openCompareModal(item);
      });
    });
  }

  function formatNum(n){
    if(Number.isInteger(n)) return n.toString();
    return n.toFixed(2).replace(/\.?0+$/, "");
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  // ---------- 啟動 ----------
  renderLocationOptions();

  const cached = localStorage.getItem(LS_CACHE_KEY);
  if(cached){
    try{
      items = JSON.parse(cached);
      renderLocationOptions();
      renderCategoryChips();
      renderTable();
    }catch(e){}
  }
  loadItems();

})();
</script>

</body>
</html>
